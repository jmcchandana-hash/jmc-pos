    ],
    rows: [...byDay.entries()].map(([k, r]) => [k, r.orders, round2(r.revenue), round2(r.profit), round2(r.Cash), round2(r.Card), round2(r['Bank Transfer']), round2(r.Credit)]),
  };
  const bytes = buildXlsx([salesSheet, itemsSheet, daySheet]);
  downloadBlob(`sales-${label}-${dayKey(new Date())}.xlsx`, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
};

/** Every customer WhatsApp number collected from bills, credit sales and orders, one row per number. */
const Contacts = {
  collect() {
    const m = new Map();
    const touch = (name, phone, when, kind, amount, due) => {
      const num_ = WA.number(phone);
      if (num_.length < 9) return;
      const r = m.get(num_) || { name: '', wa: num_, phone: '', sources: new Set(), sales: 0, orders: 0, spent: 0, due: 0, last: 0 };
      if (name && (!r.name || when >= r.last)) r.name = name;
      if (phone && when >= r.last) r.phone = phone;
      r.sources.add(kind); r.last = Math.max(r.last, when);
      if (kind === 'Order') { r.orders += 1; } else { r.sales += 1; r.spent += amount; }
      r.due += due;
      m.set(num_, r);
    };
    S.sales.forEach((s) => touch((s.customerName || '').trim(), s.customerPhone, new Date(s.date).getTime(), saleDue(s) > 0 ? 'Credit' : 'Sale', num(s.total), saleDue(s)));
    S.orders.forEach((o) => touch((o.customerName || '').trim(), o.phone, o.createdAt || 0, 'Order', num(o.price), isOpenOrder(o) ? Orders.balance(o) : 0));
    return [...m.values()].sort((a, b) => (a.name || '~').localeCompare(b.name || '~'));
  },
  skipped() {
    return S.sales.filter((s) => s.customerName && !s.customerPhone).length + S.orders.filter((o) => o.customerName && !o.phone).length;
  },
  xlsx() {
    const list = this.collect();
    if (!list.length) return false;
    const sheet = {
      name: 'WhatsApp numbers',
      cols: [
        { h: 'Name', w: 26, t: 's' }, { h: 'WhatsApp number (94…)', w: 22, t: 's' }, { h: 'Phone as entered', w: 18, t: 's' }, { h: 'From', w: 18, t: 's' },
        { h: 'Bills', w: 8, t: 'n', sum: true }, { h: 'Orders', w: 8, t: 'n', sum: true }, { h: 'Total bought', w: 15, t: 'm', sum: true }, { h: 'Unpaid', w: 14, t: 'm', sum: true }, { h: 'Last activity', w: 18, t: 'dt' },
      ],
      rows: list.map((r) => [r.name || '(no name)', r.wa, r.phone, [...r.sources].join(' + '), r.sales, r.orders, round2(r.spent), round2(r.due), new Date(r.last || Date.now()).toISOString()]),
    };
    downloadBlob(`whatsapp-numbers-${dayKey(new Date())}.xlsx`, buildXlsx([sheet]), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    return list.length;
  },
  /** Contacts file that a phone can import straight into its address book. */
  vcf() {
    const list = this.collect();
    if (!list.length) return false;
    const txt = list.map((r) => `BEGIN:VCARD\r\nVERSION:3.0\r\nFN:${(r.name || r.wa).replace(/[\r\n,;]/g, ' ')}\r\nTEL;TYPE=CELL:+${r.wa}\r\nEND:VCARD`).join('\r\n');
    downloadBlob(`customers-${dayKey(new Date())}.vcf`, txt, 'text/vcard');
    return list.length;
  },
};


/* =====================================================================
   13. ORDERS  (customer orders with photos, due dates, WhatsApp reminders)
   Photos live in IndexedDB (not localStorage) so they do not fill the 5 MB limit.
   ===================================================================== */
const IDB = {
  db: null,
  open() {
    if (!this.db) {
      this.db = new Promise((resolve, reject) => {
        const r = indexedDB.open('jmcpos', 2);
        r.onupgradeneeded = () => { ['kv', 'photos'].forEach((n) => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); };
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }
    return this.db;
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const q = fn(db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => resolve(q.result);
      q.onerror = () => reject(q.error);
    });
  },
  get(s, k) { return this.tx(s, 'readonly', (o) => o.get(k)); },
  put(s, k, v) { return this.tx(s, 'readwrite', (o) => o.put(v, k)); },
  del(s, k) { return this.tx(s, 'readwrite', (o) => o.delete(k)); },
  keys(s) { return this.tx(s, 'readonly', (o) => o.getAllKeys()); },
};

const Photos = {
  cache: new Map(),
  async put(id, url) { if (!Clean.id(id) || !Clean.photoUrl(url)) return; this.cache.set(id, url); try { await IDB.put('photos', id, url); } catch { /* memory only */ } },
  async get(id) {
    if (this.cache.has(id)) return this.cache.get(id);
    try { const v = await IDB.get('photos', id); if (v) this.cache.set(id, v); return v || null; } catch { return null; }
  },
  async keys() { try { return new Set([...(await IDB.keys('photos')), ...this.cache.keys()]); } catch { return new Set(this.cache.keys()); } },
  /** Photo ids used by orders that this device does not have yet. */
  async missing() { const have = await this.keys(); return Orders.photoIds().filter((id) => !have.has(id)); },
  async fromFile(file) {
    const url = await imageToDataURL(file, 1280, 'image/jpeg', 0.72);
    const id = `ph${uid()}`;
    await this.put(id, url);
    return id;
  },
  /** Fill every <img data-photo="id"> that has no source yet. */
  async hydrate(root = document) {
    for (const img of $$('img[data-photo]', root)) {
      if (img.getAttribute('src')) continue;
      const url = await this.get(img.dataset.photo);
      if (url) img.src = url;
    }
  },
  async all(ids) { const out = {}; for (const id of ids) { const v = await this.get(id); if (v) out[id] = v; } return out; },
  async putMany(map) { if (!isPlainObject(map)) return 0; let n = 0; const have = await this.keys(); for (const [id, url] of Object.entries(map)) { if (!have.has(id) && typeof url === 'string' && url.startsWith('data:image')) { await this.put(id, url); n++; } } return n; },
};

const ORDER_STATUS = [
  { id: 'Pending', label: 'Pending', cls: 'bg-amber-500/20 text-amber-800 dark:text-amber-200' },
  { id: 'In progress', label: 'In progress', cls: 'bg-sky-500/20 text-sky-800 dark:text-sky-200' },
  { id: 'Ready', label: 'Ready', cls: 'bg-emerald-500/20 text-emerald-800 dark:text-emerald-200' },
  { id: 'Delivered', label: 'Delivered', cls: 'bg-slate-500/20 text-slate-700 dark:text-slate-300' },
  { id: 'Cancelled', label: 'Cancelled', cls: 'bg-red-500/20 text-red-800 dark:text-red-200' },
];
const isOpenOrder = (o) => o.status !== 'Delivered' && o.status !== 'Cancelled';
const daysUntil = (dueDate) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dueDate || ''))) return null;
  return Math.round((new Date(`${dueDate}T00:00:00`) - new Date(`${dayKey(new Date())}T00:00:00`)) / 864e5);
};
const dueLabel = (o) => {
  const d = daysUntil(o.dueDate);
  if (d === null) return { text: 'No date', cls: 'bg-slate-500/15 text-slate-600 dark:text-slate-300' };
  if (!isOpenOrder(o)) return { text: fmtDate(`${o.dueDate}T00:00:00`), cls: 'bg-slate-500/15 text-slate-600 dark:text-slate-300' };
  if (d < 0) return { text: `Overdue ${-d}d`, cls: 'bg-red-500/20 text-red-700 dark:text-red-300' };
  if (d === 0) return { text: 'Due today', cls: 'bg-orange-500/25 text-orange-800 dark:text-orange-200' };
  if (d === 1) return { text: 'Due tomorrow', cls: 'bg-amber-500/25 text-amber-800 dark:text-amber-200' };
  return { text: `${fmtDate(`${o.dueDate}T00:00:00`)} · ${d}d`, cls: 'bg-primary-500/15 text-primary-800 dark:text-primary-200' };
};

const Orders = {
  clean(r) {
    if (!r || !r.id || !r.no) return null;
    return {
      id: String(r.id), no: String(r.no), customerName: String(r.customerName || ''), phone: String(r.phone || ''),
      title: String(r.title || ''), notes: String(r.notes || ''), dueDate: /^\d{4}-\d{2}-\d{2}$/.test(String(r.dueDate || '')) ? r.dueDate : '',
      price: num(r.price), advance: num(r.advance), status: ORDER_STATUS.some((s) => s.id === r.status) ? r.status : 'Pending',
      photos: Array.isArray(r.photos) ? r.photos.map(String) : [], createdAt: num(r.createdAt) || Date.now(), createdBy: String(r.createdBy || ''),
      updatedAt: num(r.updatedAt), remindedFor: String(r.remindedFor || ''), remindedAt: num(r.remindedAt),
    };
  },
  find(id) { return S.orders.find((o) => o.id === id); },
  balance(o) { return Math.max(0, round2(num(o.price) - num(o.advance))); },
  photoIds() { return [...new Set(S.orders.flatMap((o) => o.photos))]; },
  nextNo() {
    let no;
    do { S.orderCounter += 1; no = `ORD-${S.companySettings.deviceCode ? `${S.companySettings.deviceCode}-` : ''}${String(S.orderCounter).padStart(4, '0')}`; }
    while (S.orders.some((o) => o.no === no));
    return no;
  },
  save(data, existing) {
    const now = Date.now();
    const { no, ...rest } = data;
    data = rest;
    if (existing) { Object.assign(existing, data, no ? { no } : {}, { updatedAt: now }); if (data.dueDate !== undefined) existing.remindedFor = data.dueDate === existing.remindedFor ? existing.remindedFor : ''; Store.save('orders'); return existing; }
    const o = Orders.clean({ ...data, id: uid(), no: no || Orders.nextNo(), createdAt: now, updatedAt: now, createdBy: S.companySettings.cashier });
    S.orders.push(o);
    delete S.deleted.orders[o.id];
    Store.save('orders', 'orderCounter');
    return o;
  },
  setStatus(o, status) { o.status = status; o.updatedAt = Date.now(); Store.save('orders'); },
  remove(o) { S.orders = S.orders.filter((x) => x.id !== o.id); S.deleted.orders[o.id] = Date.now(); Store.save('orders', 'deleted'); },
  customerText(o) {
    const co = S.companySettings;
    const bal = Orders.balance(o);
    return [`Hello ${o.customerName || ''},`.trim(),
      `Your order *${o.title || o.no}* (${o.no}) ${o.status === 'Ready' ? 'is READY for pickup' : o.dueDate ? `is due on ${fmtDate(`${o.dueDate}T00:00:00`)}` : `is ${o.status}`}.`,
      bal > 0 ? `Balance to pay: ${money(bal)}` : 'Fully paid. Thank you!', `- ${co.name}, ${co.phone}`].join('\n');
  },
  /** Calendar file with alarms (works on phones even when the app is closed). */
  ics(list) {
    const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const [hh, mm] = (/^\d\d:\d\d$/.test(S.companySettings.remindTime || '') ? S.companySettings.remindTime : '08:00').split(':').map(Number);
    const hm = hh * 60 + mm, days = Math.max(0, Math.floor(num(S.companySettings.remindDays)));
    const ev = list.filter((o) => o.dueDate).map((o) => {
      const d0 = o.dueDate.replace(/-/g, '');
      const d1 = new Date(`${o.dueDate}T00:00:00`); d1.setDate(d1.getDate() + 1);
      const end = dayKey(d1).replace(/-/g, '');
      const alarm = (mins, text) => ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${text}`, `TRIGGER:${mins >= 0 ? '' : '-'}PT${Math.abs(mins)}M`, 'END:VALARM'];
      const alarms = [...alarm(hm - days * 1440, days ? `Order due in ${days} day(s)` : 'Order due today'), ...(days ? alarm(hm, 'Order due today') : [])];
      return ['BEGIN:VEVENT', `UID:${o.id}@jmcpos`, `DTSTAMP:${stamp(new Date())}`, `DTSTART;VALUE=DATE:${d0}`, `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${`ORDER DUE: ${o.title || o.no} - ${o.customerName}`.replace(/[,;\n]/g, ' ')}`,
        `DESCRIPTION:${`${o.no} | ${o.customerName} ${o.phone} | Balance ${Orders.balance(o)}`.replace(/[,;\n]/g, ' ')}`,
        ...alarms, 'END:VEVENT'].join('\r\n');
    });
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//JMC POS//EN', ...ev, 'END:VCALENDAR'].join('\r\n');
  },
};

/** Due-date reminders. A browser page cannot send WhatsApp messages by itself, so the app prepares the
    message and opens WhatsApp with one tap. It checks every minute while the app is open. */
const Reminders = {
  lastNotified: 0,
  pending() {
    const days = Math.max(0, Math.floor(num(S.companySettings.remindDays)));
    const hm = /^\d\d:\d\d$/.test(S.companySettings.remindTime || '') ? S.companySettings.remindTime : '08:00';
    const now = Date.now();
    const due = (o) => { const at = new Date(`${o.dueDate}T${hm}:00`); at.setDate(at.getDate() - days); return now >= at.getTime(); };   // the reminder starts at the chosen time of day
    return S.orders.filter((o) => isOpenOrder(o) && o.dueDate && o.remindedFor !== o.dueDate && due(o))
      .sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1));
  },
  text(list) {
    const co = S.companySettings;
    const lines = list.map((o, i) => {
      const d = daysUntil(o.dueDate);
      const when = d < 0 ? `OVERDUE ${-d}d` : d === 0 ? 'TODAY' : d === 1 ? 'TOMORROW' : fmtDate(`${o.dueDate}T00:00:00`);
      return `${i + 1}. ${o.no} · ${o.title || '-'}\n   ${o.customerName || '-'}${o.phone ? ` (${o.phone})` : ''} · ${when} · Balance ${money(Orders.balance(o))} · ${o.status}`;
    });
    return `⏰ *${co.name} - Order reminder*\n${list.length} order${list.length === 1 ? '' : 's'} to deliver:\n\n${lines.join('\n')}`;
  },
  send(list = this.pending()) {
    if (!list.length) return;
    const now = Date.now();
    WA.send(this.text(list), S.companySettings.reminderPhone || S.companySettings.phone);
    list.forEach((o) => { o.remindedFor = o.dueDate; o.remindedAt = now; o.updatedAt = now; });
    Store.save('orders');
    this.renderBar();
    if (Router.current() === 'orders') Router.refresh();
  },
  backupDue() {
    const n = Math.floor(num(S.companySettings.backupEvery));
    if (!n || !(S.sales.length || S.orders.length || S.products.length)) return false;
    return !S.device.lastBackup || Date.now() - S.device.lastBackup > n * 864e5;
  },
  renderBar() {
    const el = $('#reminder-bar');
    if (!el) return;
    const p = this.pending();
    const tone = 'flex flex-wrap items-center gap-3 rounded-3xl border border-amber-400/50 bg-amber-300/40 px-4 py-3 text-sm font-semibold text-amber-950 dark:bg-amber-400/15 dark:text-amber-100';
    let html = '';
    if (p.length) {
      const overdue = p.filter((o) => daysUntil(o.dueDate) < 0).length;
      const label = p.every((o) => daysUntil(o.dueDate) === 1) ? 'due tomorrow' : p.every((o) => daysUntil(o.dueDate) === 0) ? 'due today' : overdue ? `to deliver (${overdue} overdue)` : 'due soon';
      html += `<div class="${tone}">${icon('bell', 'h-5 w-5 shrink-0')}<span class="min-w-0 basis-full sm:basis-0 sm:flex-1">${p.length} order${p.length === 1 ? '' : 's'} ${label}: ${esc(p.slice(0, 2).map((o) => o.title || o.no).join(', '))}${p.length > 2 ? '…' : ''}</span>
        <a href="#orders" class="${C.btnGhost} !py-1.5">View</a><button type="button" data-action="remind-send" class="${C.btnWa} !py-1.5">${icon('chat', 'h-4 w-4')} WhatsApp reminder</button></div>`;
    }
    if (this.backupDue()) {
      html += `<div class="${tone} ${p.length ? 'mt-2' : ''}">${icon('mail', 'h-5 w-5 shrink-0')}<span class="min-w-0 basis-full sm:basis-0 sm:flex-1">Backup is due (${S.device.lastBackup ? `last one ${fmtDate(S.device.lastBackup)}` : 'never backed up'}).</span>
        <button type="button" data-action="backup-email" class="${C.btn} !py-1.5">Email backup now</button><button type="button" data-action="backup-snooze" class="${C.btnGhost} !py-1.5">Later</button></div>`;
    }
    el.innerHTML = html;
    if (p.length > this.lastNotified && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      try { new Notification(`${S.companySettings.name}: ${p.length} order(s) due`, { body: p.slice(0, 3).map((o) => `${o.title || o.no} - ${o.customerName}`).join('\n') }); } catch { /* ignore */ }
    }
    if (p.length > this.lastNotified) { try { beep(true); } catch { /* sound is optional */ } }
    this.lastNotified = p.length;
    setTimeout(() => WABot.auto(), 0);
  },
  start() {
    this.renderBar();
    setInterval(() => this.renderBar(), 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.renderBar(); });
  },
};


/* =====================================================================
   14. CLOUD SYNC (phone + PC see the same data) and EMAIL BACKUP
   ---------------------------------------------------------------------
   Uses a free Firebase Realtime Database through its plain REST API (no SDK,
   still one file). Each device writes only its own record and merges the
   others with the same deterministic merge as the other sync modes, so the
   app keeps working offline and catches up when the internet returns.
   ===================================================================== */
const CloudSync = {
  state: 'off', msg: '', lastRun: null, lastFail: null, lastFailMsg: '', peers: 0, dirty: true, ver: 1, busy: false, seen: {}, timer: null, _t: null, onStatus: null,
  cfg() { return S.device.cloud; },
  enabled() { const c = this.cfg(); return !!(c && c.url && c.code); },
  base() { const c = this.cfg(); return `${c.url}/shops/${encodeURIComponent(c.code)}`; },
  emit() { if (this.onStatus) this.onStatus(); },
  uploaded() { try { return new Set(JSON.parse(localStorage.getItem('cloudPhotos') || '[]')); } catch { return new Set(); } },
  saveUploaded(set) { try { localStorage.setItem('cloudPhotos', JSON.stringify([...set])); } catch { /* ignore */ } },

  async req(method, path, body) {
    const c = this.cfg();
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch(`${this.base()}/${path}.json${c.auth ? `?auth=${encodeURIComponent(c.auth)}` : ''}`, { method, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal });
      if (!r.ok) { const e = new Error(r.status === 401 || r.status === 403 ? 'Permission denied. Check the database rules / secret' : `Server said ${r.status}`); e.http = r.status; throw e; }
      return await r.json();
    } finally { clearTimeout(to); }
  },

  normalizeUrl(u) {
    let x = String(u || '').trim().replace(/\.json.*$/, '').replace(/\/+$/, '');
    if (x && !/^https?:\/\//i.test(x)) x = `https://${x}`;
    return x;
  },
  randomCode() { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map((b) => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join(''); },
  linkCode() { const c = this.cfg(); return `JMC1-${btoa(unescape(encodeURIComponent(JSON.stringify([c.url, c.code, c.auth || '']))))}`; },
  parseLink(text) {
    const m = String(text || '').trim().match(/JMC1-([A-Za-z0-9+/=]+)/);
    if (!m) throw new Error('That is not a valid link code');
    const [url, code, auth] = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    return { url, code, auth };
  },

  /** Save the connection and run a first sync. Throws a readable error when it cannot connect. */
  async connect({ url, code, auth }) {
    url = this.normalizeUrl(url); code = String(code || '').trim();
    if (!/^https?:\/\/.+/i.test(url)) throw new Error('Enter the database URL (it starts with https://)');
    if (code.length < 8 || /[^A-Za-z0-9_-]/.test(code)) throw new Error('Shop code must be at least 8 letters/numbers (no spaces)');
    S.device.cloud = { url, code, auth: String(auth || '').trim() };
    Store.save('device');
    try { await this.req('GET', 'meta'); }
    catch (e) { S.device.cloud = { url: '', code: '', auth: '' }; Store.save('device'); throw new Error(e.http ? e.message : 'Cannot reach the database. Check the URL and your internet'); }
    this.start();
  },
  disconnect() { clearInterval(this.timer); clearTimeout(this._t); S.device.cloud = { url: '', code: '', auth: '' }; Store.save('device'); this.state = 'off'; this.msg = ''; this.seen = {}; this.emit(); },
  start() { clearInterval(this.timer); this.dirty = true; this.state = 'ok'; this.timer = setInterval(() => this.run(), 15000); this.run(); },
  init() {
    window.addEventListener('online', () => this.run());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.run(); });
    if (this.enabled()) this.start();
  },
  /** One honest status: 'Synced' only when nothing is waiting to be uploaded. */
  status() {
    if (!this.enabled() || this.state === 'off') return 'off';
    if (this.busy) return 'syncing';
    if (this.state === 'offline' || navigator.onLine === false) return 'offline';
    if (this.state === 'error') return 'failed';
    return this.dirty ? 'pending' : 'synced';
  },
  /** Approximate number of records changed since the last successful upload. */
  pendingCount() {
    const since = num((this.cfg() || {}).lastUp);
    const t = (r) => Math.max(num(r.updatedAt), num(r.createdAt), num(r.deletedAt));
    const lists = [S.products, S.categories, S.sales, S.orders, S.invoices].filter(Array.isArray);
    let n = 0; lists.forEach((l) => l.forEach((r) => { if (r && typeof r === 'object' && t(r) > since) n++; }));
    return n;
  },
  markDirty() { this.dirty = true; this.ver += 1; if (this.enabled() && this.state !== 'off') { clearTimeout(this._t); this._t = setTimeout(() => this.run(), 2000); } },

  async run() {
    if (!this.enabled() || this.busy) return;
    if (navigator.onLine === false) { this.state = 'offline'; this.msg = 'No internet. Working offline; it will sync when the connection is back.'; this.emit(); return; }
    this.busy = true; this.emit();
    const startVer = this.ver, startAt = Date.now();
    try {
      const own = S.device.id;
      let changed = 0;
      const meta = (await this.req('GET', 'meta')) || {};
      const peers = Object.keys(meta).filter((id) => id !== own);
      for (const id of peers) {
        const at = num(meta[id] && meta[id].at);
        if (this.seen[id] === at) continue;
        const snap = await this.req('GET', `devices/${encodeURIComponent(id)}`);
        if (snap) { try { changed += Sync.merge(snap).total; } catch { /* bad record: skip */ } }
        this.seen[id] = at;
      }
      let n = 0;
      for (const id of await Photos.missing()) {
        if (n++ >= 10) break;
        const url = await this.req('GET', `photos/${encodeURIComponent(id)}`);
        if (Clean.id(id) && Clean.photoUrl(url)) { await Photos.put(id, url); changed++; }
      }
      const up = this.uploaded(); const have = await Photos.keys(); let upChanged = false;
      for (const id of Orders.photoIds()) {
        if (up.has(id) || !have.has(id)) continue;
        await this.req('PUT', `photos/${encodeURIComponent(id)}`, await Photos.get(id));
        up.add(id); upChanged = true;
      }
      if (upChanged) this.saveUploaded(up);
      if (this.dirty || changed) {
        await this.req('PUT', `devices/${encodeURIComponent(own)}`, Sync.snapshot());
        await this.req('PUT', `meta/${encodeURIComponent(own)}`, { at: Date.now(), name: S.companySettings.cashier || '' });
        if (this.ver === startVer) { this.dirty = false; this.cfg().lastUp = startAt; }   // changes made during the upload stay pending
      }
      this.state = 'ok'; this.msg = ''; this.lastRun = Date.now(); this.peers = peers.length;
      S.device.lastSync = this.lastRun; Store.save('device');
      if (changed) App.remoteChanged(changed);
    } catch (e) {
      const offline = e instanceof TypeError || e.name === 'AbortError';
      this.state = offline ? 'offline' : 'error';
      this.msg = offline ? 'Cannot reach the internet right now. Working offline; it will retry.' : (e.message || String(e));
      this.lastFail = Date.now(); this.lastFailMsg = this.msg;
    } finally { this.busy = false; this.emit(); if (this.dirty && this.state === 'ok') { clearTimeout(this._t); this._t = setTimeout(() => this.run(), 2000); } }
  },
};

/** Backup to email. Phones: the share sheet lets you pick Gmail/Outlook with the file attached.
    PC: the file is downloaded and a ready-to-send email opens (attach the downloaded file). */
const BackupMail = {
  async file() {
    const data = await Backup.full();
    return new File([JSON.stringify(data)], `jmcpos-backup-${Backup.stamp()}.json`, { type: 'application/json' });
  },
  mark() { S.device.lastBackup = Date.now(); Store.save('device'); Reminders.renderBar(); },
  async send() {
    const co = S.companySettings;
    const to = co.backupEmail || '';
    const f = await this.file();
    const subject = `${co.name} POS backup ${Backup.stamp()}`;
    const body = `Backup of ${co.name} POS (${S.sales.length} sales, ${S.products.length} products, ${S.orders.length} orders).\nKeep this file safe. Restore it from Data & Sync > Restore backup.`;
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: subject, text: body }); this.mark(); return 'shared'; }
      catch (e) { if (e.name === 'AbortError') return 'cancel'; }
    }
    downloadBlob(f.name, new Uint8Array(await f.arrayBuffer()), 'application/json');
    this.mark();
    const q = `subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`${body}\n\n(Attach the file ${f.name} that was just downloaded.)`)}`;
    window.open(`mailto:${encodeURIComponent(to)}?${q}`, '_self');
    return 'mailto';
  },
  gmail() {
    const co = S.companySettings;
    const q = `view=cm&fs=1&to=${encodeURIComponent(co.backupEmail || '')}&su=${encodeURIComponent(`${co.name} POS backup ${Backup.stamp()}`)}&body=${encodeURIComponent('Attach the downloaded backup file (jmcpos-backup-*.json) to this email.')}`;
    window.open(`https://mail.google.com/mail/?${q}`, '_blank', 'noopener');
  },
};


/** Automatic WhatsApp reminders to the shop number.
    A web page cannot send WhatsApp messages by itself, so the free CallMeBot service delivers them: the shop phone
    activates it once (gets an API key). Two modes:
    1. App mode: the app sends the message itself at the reminder time while it is open.
    2. Server mode: the owner's Google script (the same one used for email backup) sends it at the reminder time even when the app is closed. */
const WABot = {
  busy: false,
  cfg() { const d = S.device.waBot || (S.device.waBot = { key: '', status: '' }); return { get key() { return S.companySettings.waKey || ''; }, set key(v) { setShared('waKey', v); }, get status() { return d.status || ''; }, set status(v) { d.status = v; } }; },
  hasKey() { return !!this.cfg().key; },
  phone() { return WA.number(S.companySettings.reminderPhone || S.companySettings.phone); },
  url(text) { return `https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(`+${this.phone()}`)}&text=${encodeURIComponent(text)}&apikey=${encodeURIComponent(this.cfg().key)}`; },
  async send(text) {
    if (!this.hasKey()) throw new Error('Enter the CallMeBot API key first');
    if (navigator.onLine === false) throw new Error('No internet right now');
    await fetch(this.url(text), { mode: 'no-cors' });   // the reply is hidden from web pages: no error means it was handed over
  },
  mode() { return AutoMail.enabled() ? 'server' : 'app'; },
  /** App mode: send due reminders by itself (called every minute from the reminder bar). Goes to every channel that is on (WhatsApp and/or Telegram). */
  async auto() {
    if (this.busy || AutoMail.enabled()) return;
    if (!this.hasKey() && !TG.on()) return;
    if (!Reminders.pending().length) return;
    this.busy = true;
    try {
      // another device may have sent it a moment ago: fetch the latest first so the same reminder is not sent twice
      if (CloudSync.enabled()) { CloudSync.busy = false; try { await CloudSync.run(); } catch { /* offline: carry on */ } }
      const wa = this.hasKey(), tg = TG.on();
      const list = Reminders.pending();
      if (!list.length || (!wa && !tg)) return;
      const text = Reminders.text(list), sent = [], errs = [];
      if (wa) { try { await this.send(text); sent.push('WhatsApp'); } catch (e) { errs.push(`WhatsApp: ${e.message || e}`); } }
      if (tg) { try { await TG.send(text); sent.push('Telegram'); } catch (e) { errs.push(`Telegram: ${e.message || e}`); } }
      if (!sent.length) throw new Error(errs.join(' · '));
      const now = Date.now();
      list.forEach((o) => { o.remindedFor = o.dueDate; o.remindedAt = now; o.updatedAt = now; });
      Store.save('orders');
      const st = `Last reminder sent ${fmtDateTime(now)}${errs.length ? ` (${errs.join(' · ')})` : ''}`;
      if (wa) this.cfg().status = st;
      if (tg) TG.cfg().status = st;
      Store.save('device');
      Reminders.renderBar();
      Toast.show(`${sent.join(' + ')} reminder sent for ${list.length} order${list.length === 1 ? '' : 's'}`, 'success');
      if (Router.current() === 'orders' || Router.current() === 'data') Router.refresh();
    } catch (e) {
      const st = `Will retry: ${e.message || e}`;
      if (this.hasKey()) this.cfg().status = st;
      if (TG.on()) TG.cfg().status = st;
    }
    finally { this.busy = false; }
  },
};

/** Automatic Telegram reminders. Uses the official Telegram Bot API directly (no third party in between).
    The owner makes a bot with @BotFather once, presses Start on it, and the app finds the chat by itself.
    It can be on at the same time as WhatsApp. */
const TG = {
  cfg() { const d = S.device.tgBot || (S.device.tgBot = { token: '', chat: '', chatName: '', status: '' }); const cs = () => S.companySettings;
    return { get token() { return cs().tgToken || ''; }, set token(v) { setShared('tgToken', v); }, get chat() { return cs().tgChat || ''; }, set chat(v) { setShared('tgChat', v); },
      get chatName() { return cs().tgChatName || ''; }, set chatName(v) { setShared('tgChatName', v); }, get status() { return d.status || ''; }, set status(v) { d.status = v; } }; },
  on() { const c = this.cfg(); return !!(c.token && c.chat); },
  validToken(t) { return /^\d{6,}:[A-Za-z0-9_-]{30,}$/.test(t); },
  async call(method, body = {}, token = this.cfg().token) {
    if (navigator.onLine === false) throw new Error('No internet right now');
    let r;
    try { r = await fetch(`https://api.telegram.org/bot${token}/${method}`, { method: 'POST', body: new URLSearchParams(body) }); }
    catch { throw new Error('Cannot reach Telegram. Check your internet'); }
    let j = null;
    try { j = await r.json(); } catch { /* not JSON */ }
    if (!j || !j.ok) throw new Error(j && j.description ? `Telegram: ${j.description}` : `Telegram error ${r.status}`);
    return j.result;
  },
  async send(text) {
    if (!this.on()) throw new Error('Telegram is not set up');
    await this.call('sendMessage', { chat_id: this.cfg().chat, text: String(text).replace(/\*/g, '') });
  },
  /** Looks at the bot's recent messages and returns the newest chat that wrote to it. */
  async findChat(token) {
    const ups = await this.call('getUpdates', { limit: 100 }, token);
    for (let i = ups.length - 1; i >= 0; i--) {
      const u = ups[i], m = u.message || u.channel_post || u.edited_message || (u.my_chat_member && { chat: u.my_chat_member.chat });
      if (m && m.chat && m.chat.id) {
        const ch = m.chat;
        return { id: String(ch.id), name: ch.title || [ch.first_name, ch.last_name].filter(Boolean).join(' ') || (ch.username ? `@${ch.username}` : String(ch.id)) };
      }
    }
    throw new Error('No chat found yet. Open your bot in Telegram, press Start (or send any message to it), then try again');
  },
};

/** Automatic email backup. The app posts the backup to a tiny Google Apps Script that the owner creates once
    in their own Google account; the script emails the file to the owner's Gmail. No server of ours is involved. */
const AutoMail = {
  busy: false, timer: null,
  cfg() { return S.device.autoMail; },
  enabled() { const c = this.cfg(); return !!(c && c.url && c.token); },
  newToken() { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map((b) => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join(''); },
  script() {
    return `// JMC STUDIO POS: automatic backup to your Gmail + automatic WhatsApp / Telegram order reminders
var TOKEN = '${this.cfg().token}';
var TO = '${String(S.companySettings.backupEmail || '').replace(/[^A-Za-z0-9@._+-]/g, '')}';   // empty = your own Gmail
var TZ = 'Asia/Colombo';
function out_(t) { return ContentService.createTextOutput(t); }
function doPost(e) {
  var d = JSON.parse(e.postData.contents);
  if (d.token !== TOKEN) return out_('denied');
  if (d.action === 'orders') { saveOrders_(d); return out_('ok'); }
  if (d.action === 'test') { return out_(notify_(d, d.text)); }
  var blob = Utilities.newBlob(d.body, 'application/json', d.name);
  GmailApp.sendEmail(TO || Session.getEffectiveUser().getEmail(), d.subject, d.text, { attachments: [blob] });
  return out_('ok');
}
function saveOrders_(d) {
  var p = PropertiesService.getScriptProperties();
  var s = JSON.stringify(d), n = Math.ceil(s.length / 8000), old = Number(p.getProperty('n') || 0), i;
  for (i = 0; i < n; i++) p.setProperty('c' + i, s.substr(i * 8000, 8000));
  for (i = n; i < old; i++) p.deleteProperty('c' + i);
  p.setProperty('n', String(n));
  var has = ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'dailyCheck'; });
  if (!has) ScriptApp.newTrigger('dailyCheck').timeBased().everyMinutes(15).create();
}
function sendWa_(phone, key, text) {
  var url = 'https://api.callmebot.com/whatsapp.php?phone=' + encodeURIComponent('+' + phone) + '&text=' + encodeURIComponent(text) + '&apikey=' + encodeURIComponent(key);
  var r = UrlFetchApp.fetch(url, { muteHttpExceptions: true });
  return r.getResponseCode() === 200 ? 'ok' : 'failed ' + r.getResponseCode();
}
function sendTg_(token, chat, text) {
  var r = UrlFetchApp.fetch('https://api.telegram.org/bot' + token + '/sendMessage', { method: 'post', payload: { chat_id: String(chat), text: text }, muteHttpExceptions: true });
  if (r.getResponseCode() === 200) return 'ok';
  var why = ''; try { why = JSON.parse(r.getContentText()).description || ''; } catch (e) {}
  return 'Telegram ' + r.getResponseCode() + ' ' + why;
}
function notify_(c, text) {
  var res = [];
  if (c.key) res.push(sendWa_(c.phone, c.key, text));
  if (c.tgToken && c.tgChat) res.push(sendTg_(c.tgToken, c.tgChat, text.replace(/\\*/g, '')));
  return res.indexOf('ok') >= 0 ? 'ok' : (res.join(', ') || 'no channel');
}
function ymd_(date, days) { var x = new Date(date + 'T12:00:00+05:30'); x.setDate(x.getDate() + days); return Utilities.formatDate(x, TZ, 'yyyy-MM-dd'); }
function dailyCheck() {
  var p = PropertiesService.getScriptProperties(), n = Number(p.getProperty('n') || 0), s = '', i;
  for (i = 0; i < n; i++) s += p.getProperty('c' + i);
  if (!s) return;
  var c = JSON.parse(s), now = new Date();
  var today = Utilities.formatDate(now, TZ, 'yyyy-MM-dd'), hm = Utilities.formatDate(now, TZ, 'HH:mm');
  if (hm < c.time || (!c.key && !(c.tgToken && c.tgChat))) return;
  var sent = JSON.parse(p.getProperty('sent') || '{}'), list = [], keep = {};
  c.orders.forEach(function (o) {
    var k = o.no + '|' + o.dueDate;
    if (sent[k]) keep[k] = true;
    else if (today >= ymd_(o.dueDate, -c.days)) list.push(o);
  });
  if (!list.length) { p.setProperty('sent', JSON.stringify(keep)); return; }
  var lines = list.map(function (o, j) {
    var when = o.dueDate < today ? 'OVERDUE' : o.dueDate === today ? 'TODAY' : o.dueDate === ymd_(today, 1) ? 'TOMORROW' : o.dueDate;
    return (j + 1) + '. ' + o.no + ' - ' + (o.title || '-') + '\\n   ' + (o.customerName || '-') + (o.phone ? ' (' + o.phone + ')' : '') + ' - ' + when + ' - Balance ' + o.balance + ' - ' + o.status;
  });
  var text = c.shop + ' - Order reminder\\n' + list.length + ' order(s) to deliver:\\n\\n' + lines.join('\\n');
  if (notify_(c, text) === 'ok') {
    list.forEach(function (o) { keep[o.no + '|' + o.dueDate] = true; });
    p.setProperty('sent', JSON.stringify(keep));
  }
}`;
  },
  /** Server mode: give the Google script the open orders + reminder settings, so it can send the WhatsApp reminder on its own. */
  queueOrders: debounce(() => { if (AutoMail.enabled() && (WABot.hasKey() || TG.on())) AutoMail.sendOrders().catch(() => {}); }, 4000),
  async sendOrders(test = false) {
    const c = this.cfg();
    const co = S.companySettings;
    const base = { token: c.token, phone: WABot.phone(), key: WABot.cfg().key, tgToken: TG.on() ? TG.cfg().token : '', tgChat: TG.on() ? TG.cfg().chat : '' };
    let payload;
    if (test) payload = { ...base, action: 'test', text: `${co.name}: test reminder. Automatic reminders are working.` };
    else payload = { ...base, action: 'orders', shop: co.name, days: Math.max(0, Math.floor(num(co.remindDays))), time: /^\d\d:\d\d$/.test(co.remindTime || '') ? co.remindTime : '08:00',
      orders: S.orders.filter((o) => isOpenOrder(o) && o.dueDate).map((o) => ({ no: o.no, title: o.title, customerName: o.customerName, phone: o.phone, dueDate: o.dueDate, status: o.status, balance: Orders.balance(o) })) };
    try {
      const r = await fetch(c.url, { method: 'POST', body: JSON.stringify(payload) });
      const t = (await r.text()).trim();
      if (t !== 'ok') throw new Error(t === 'denied' ? 'The script did not accept the token' : `The script replied: ${t.slice(0, 160)}`);
    } catch (e) {
      if (e instanceof TypeError) { await fetch(c.url, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' }); } else throw e;
    }
    { const st = test ? 'Test sent' : `Orders sent to your Google script ${fmtDateTime(Date.now())}`; if (WABot.hasKey()) WABot.cfg().status = st; if (TG.on()) TG.cfg().status = st; Store.save('device'); }
  },
  due() {
    const c = this.cfg();
    if (!this.enabled() || !(S.sales.length || S.orders.length || S.products.length)) return false;
    return Date.now() - num(c.last) > Math.max(1, num(c.every)) * 864e5;
  },
  async send(manual = false) {
    if (this.busy || !this.enabled()) return false;
    if (navigator.onLine === false) { if (manual) throw new Error('No internet right now'); return false; }
    this.busy = true;
    const c = this.cfg();
    try {
      const co = S.companySettings;
      const body = JSON.stringify(await Backup.full());
      const payload = JSON.stringify({ token: c.token, name: `jmcpos-backup-${Backup.stamp()}.json`, subject: `${co.name} POS backup ${Backup.stamp()}`,
        text: `Automatic backup of ${co.name} POS.\nSales: ${S.sales.length}, products: ${S.products.length}, orders: ${S.orders.length}.\nRestore it from Data & Sync > Restore backup.`, body });
      let ok = false;
      try {
        const r = await fetch(c.url, { method: 'POST', body: payload });
        ok = (await r.clone().text()).trim() === 'ok';
        const t = (await r.clone().text()).trim(); if (!ok) throw new Error(t === 'denied' ? 'The script rejected the token. Turn the backup off and on again, and paste the same TOKEN that is at the top of your script' : 'The script did not accept the backup. Check that the new code is deployed as a New version, access is "Anyone", and Gmail permission was allowed');
      } catch (e) {
        if (e instanceof TypeError) { await fetch(c.url, { method: 'POST', body: payload, mode: 'no-cors' }); ok = true; } else throw e;   // browser hides the reply: assume it was sent
      }
      c.last = Date.now(); c.status = `Sent ${fmtDateTime(c.last)}`;
      S.device.lastBackup = c.last; Store.save('device'); Reminders.renderBar();
      return ok;
    } catch (e) { c.status = `Failed: ${e.message || e}`; Store.save('device'); throw e; }
    finally { this.busy = false; if (Router.current() === 'data') Router.refresh(); }
  },
  start() {
    clearInterval(this.timer);
    const tick = () => { if (this.due()) this.send().catch(() => {}); };
    this.timer = setInterval(tick, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    window.addEventListener('online', tick);
    setTimeout(tick, 4000);
  },
};


/* =====================================================================

/** Code 39 barcode as inline SVG: n = narrow, w = wide (3 bars + 2 spaces... 9 elements per character). */
const C39 = {
  '0': 'nnnwwnwnn', '1': 'wnnwnnnnw', '2': 'nnwwnnnnw', '3': 'wnwwnnnnn', '4': 'nnnwwnnnw', '5': 'wnnwwnnnn',
  '6': 'nnwwwnnnn', '7': 'nnnwnnwnw', '8': 'wnnwnnwnn', '9': 'nnwwnnwnn', A: 'wnnnnwnnw', B: 'nnwnnwnnw',
  C: 'wnwnnwnnn', D: 'nnnnwwnnw', E: 'wnnnwwnnn', F: 'nnwnwwnnn', G: 'nnnnnwwnw', H: 'wnnnnwwnn',
  I: 'nnwnnwwnn', J: 'nnnnwwwnn', K: 'wnnnnnnww', L: 'nnwnnnnww', M: 'wnwnnnnwn', N: 'nnnnwnnww',
  O: 'wnnnwnnwn', P: 'nnwnwnnwn', Q: 'nnnnnnwww', R: 'wnnnnnwwn', S: 'nnwnnnwwn', T: 'nnnnwnwwn',
  U: 'wwnnnnnnw', V: 'nwwnnnnnw', W: 'wwwnnnnnn', X: 'nwnnwnnnw', Y: 'wwnnwnnnn', Z: 'nwwnwnnnn',
  '-': 'nwnnnnwnw', '.': 'wwnnnnwnn', ' ': 'nwwnnnwnn', '*': 'nwnnwnwnn',
};
const code39 = (text) => {
  const clean = String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g, '');
  const seq = `*${clean}*`;
  let x = 0;
  const rects = [];
  for (const ch of seq) {
    const p = C39[ch];
    for (let i = 0; i < 9; i++) {
      const w = p[i] === 'w' ? 3 : 1;
      if (i % 2 === 0) rects.push(`<rect x="${x}" y="0" width="${w}" height="40"/>`);
      x += w;
    }
    x += 1;
  }
  return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" class="mx-auto h-10 w-48 max-w-full fill-black" role="img" aria-label="Barcode ${esc(clean)}">${rects.join('')}</svg>`;
};

/** Print preferences of this device (not synced). */
const PR = () => ({ mode: S.device.printMode || 'ask', invoice: S.device.invoicePaper || 'A4', sign: !!S.device.printSign, middle: S.device.printMiddle !== false });
const billSize = () => (['58', '80', 'A6'].includes(S.companySettings.receiptSize) ? S.companySettings.receiptSize : '80');

const Receipt = {

    const co = S.companySettings;

    const m = (n) => `${cur} ${fmtNum(n)}`;
    const a6 = size === 'A6';
    const a4 = size === 'A4' || a6;   // "document" layout (table) for A4 and A6
    const wrap = size === '58' ? 'w-[58mm] p-2 text-[10px]' : size === '80' ? 'w-[80mm] p-3 text-xs' : a6 ? 'w-[105mm] max-w-full p-3 text-[10.5px] leading-tight print:w-full' : 'w-[210mm] max-w-full p-8 text-sm print:w-full';
    const logo = co.logo ? `<img src="${esc(co.logo)}" alt="" class="${a4 ? (a6 ? 'h-12' : 'h-16') : 'mx-auto mb-1 max-h-14'} w-auto object-contain grayscale">` : '';
    const dash = '<div class="my-2 border-t border-dashed border-black"></div>';

      <div class="my-1 border-t border-black"></div>

          ${sealBox}
          <div class="text-center"><div class="${a6 ? 'h-8' : 'h-14'}"></div><div class="border-t border-black pt-1 text-[10px]">Authorized signature</div></div></div>`
      : `<div class="mt-6 break-inside-avoid"><div class="h-10"></div><div class="border-t border-black pt-1 text-center text-[9px]">Signature</div><div class="mx-auto mt-2 w-24">${sealBox.replace('h-20 w-28', 'h-14 w-24')}</div></div>`;

    const footer = `
      ${dash}
      <p class="whitespace-pre-line text-center font-semibold">${esc(co.footer)}</p>
      <div class="mt-2 text-center">${code39(sale.invoiceNo)}<p class="mt-0.5 text-center tracking-widest">${esc(sale.invoiceNo)}</p></div>`;

    if (a4) {
      const lines = sale.items.map((i, n) => `
        <tr class="border-b border-slate-300">
          <td class="py-2 pr-2">${n + 1}</td><td class="py-2 pr-2">${esc(i.name)}${i.sku ? `<span class="block text-xs text-slate-500">${esc(i.sku)}</span>` : ''}</td>
          <td class="py-2 text-right">${i.qty}</td><td class="py-2 text-right">${fmtNum(i.price)}</td><td class="py-2 text-right">${fmtNum(i.price * i.qty)}</td>
        </tr>`).join('');
      return `<div class="${wrap} mx-auto bg-white font-sans text-black">
        <div class="flex items-start justify-between gap-6 border-b-2 border-black pb-4">
          <div class="flex items-center gap-4">${logo}<div><p class="${a6 ? 'text-lg' : 'text-2xl'} font-bold uppercase">${esc(co.name)}</p><p>${esc(co.address)}</p><p>Tel: ${esc(co.phone)}</p></div></div>
          <div class="text-right"><p class="${a6 ? 'text-base' : 'text-xl'} font-bold">${a6 ? 'BILL' : 'INVOICE'}</p><p class="font-semibold">${esc(sale.invoiceNo)}</p><p>${fmtDate(sale.date)}</p><p>${fmtTime(sale.date)}</p><p>Cashier: ${esc(sale.cashier)}</p></div>
        </div>
        ${sale.customerName ? `<div class="mt-3"><p class="text-xs uppercase text-slate-500">Bill to</p><p class="font-semibold">${esc(sale.customerName)}</p>${sale.customerPhone ? `<p>${esc(sale.customerPhone)}</p>` : ''}</div>` : ''}
        <table class="mt-4 w-full"><thead><tr class="border-b-2 border-black text-left text-xs uppercase"><th class="py-2 pr-2">#</th><th class="py-2 pr-2">Item</th><th class="py-2 text-right">Qty</th><th class="py-2 text-right">Price</th><th class="py-2 text-right">Total</th></tr></thead><tbody>${lines}</tbody></table>
        <div class="ml-auto mt-4 ${a6 ? 'w-full' : 'w-72'} break-inside-avoid">${totals}</div>
        ${sign}
        ${footer}
      </div>`;
    }

    const lines = sale.items.map((i) => `
      <div class="mb-1">
        <p class="break-words font-semibold">${esc(i.name)}</p>
        ${row(`${i.qty} x ${fmtNum(i.price)}`, fmtNum(i.price * i.qty))}
      </div>`).join('');
    return `<div class="${wrap} bg-white font-mono leading-snug text-black">
      <div class="text-center">${logo}<p class="${size === '58' ? 'text-sm' : 'text-base'} font-bold uppercase">${esc(co.name)}</p><p>${esc(co.address)}</p><p>Tel: ${esc(co.phone)}</p></div>
      ${dash}
      ${row('Invoice', esc(sale.invoiceNo))}
      ${row('Date', fmtDate(sale.date))}
      ${row('Time', fmtTime(sale.date))}
      ${row('Cashier', esc(sale.cashier))}
      ${cust}
      ${dash}
      ${lines}
      ${dash}
      ${totals}
      ${sign}
      ${footer}
    </div>`;
  },

  /** Open the receipt preview modal. */
  show(sale, { afterSale = false } = {}) {

    Modal.open(`

        </div>

            : `<button type="button" data-action="modal-close" class="${C.btnGhost}">Close</button>`}
          <button type="button" data-action="receipt-wa" class="${C.btnWa}">${icon('chat', 'h-4 w-4')} WhatsApp</button>
          <button type="button" data-action="receipt-both" class="${C.btnGhost}">${icon('printer', 'h-4 w-4')} Bill + Invoice</button>
          <button type="button" data-action="receipt-print" class="${C.btn}">${icon('printer', 'h-4 w-4')} Print</button>

    $('#receipt-size').value = this.current.size;
    $('#rc-sign').checked = this.current.sign;
    $('#rc-mid').checked = this.current.middle;

  renderPreview() {
    const el = $('#receipt-preview');
    if (el && this.current) el.innerHTML = `<div class="m-auto w-fit shrink-0 shadow-lg">${this.html(this.current.sale, this.current.size, this.current)}</div>`;
  },
  setSize(size) { if (this.current) { this.current.size = size; this.renderPreview(); } },
  /** Height of a receipt in mm, measured off-screen (thermal rolls get a page exactly as long as the bill). */
  measureMm(html) {
    const probe = document.createElement('div');
    probe.setAttribute('data-notr', '');
    probe.className = 'invisible fixed left-0 top-0 -z-50 w-max';
    probe.innerHTML = html;
    document.body.appendChild(probe);
    const h = probe.firstElementChild.getBoundingClientRect().height;
    probe.remove();
    return Math.ceil((h * 25.4) / 96) + 3;
  },
  /** Print a sale directly (Print again, the Print button, auto-print after a sale). */
  print(sale, size, opts = {}, done = null) {
    size = size || S.companySettings.receiptSize || '80';
    const pr = PR();
    const o = { sign: opts.sign ?? pr.sign, middle: opts.middle ?? pr.middle };
    const html = this.html(sale, size, o);
    const doc = size === 'A4' || size === 'A6';
    const area = $('#print-area');
    area.innerHTML = html;
    area.className = `hidden bg-white text-black ${doc ? (o.middle ? 'print:flex print:min-h-[99vh] print:items-center print:justify-center' : 'print:flex print:items-start print:justify-center') : 'print:block'}`;
    let ps = $('#page-style');
    if (!ps) { ps = document.createElement('style'); ps.id = 'page-style'; document.head.appendChild(ps); }
    if (doc) {
      const H = size === 'A6' ? 148 : 297, h = this.measureMm(html), f = (H - 1) / h;
      // a bill only a little longer than the sheet is shrunk to fit one sheet; a really long bill continues on the next sheet
      ps.textContent = `@page{size:${size === 'A6' ? '105mm 148mm' : '210mm 297mm'};margin:0}${f < 1 && f >= 0.72 ? `#print-area>div{zoom:${f.toFixed(3)}}` : ''}`;
    } else ps.textContent = `@page{size:${size}mm ${this.measureMm(html)}mm;margin:0}`;
    const cleanup = () => {
      area.innerHTML = ''; area.className = 'hidden bg-white text-black print:block'; ps.textContent = '';
      window.removeEventListener('afterprint', cleanup);
      if (done) setTimeout(done, 500);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => window.print(), 80);
  },
  /** Print several papers one after another (e.g. the bill, then the A4 invoice). */
  async printQueue(sale, sizes, opts = {}) {
    for (const size of sizes) await new Promise((res) => this.print(sale, size, opts, res));
  },
  setSign(v) { if (this.current) { this.current.sign = v; this.renderPreview(); } },
  setMiddle(v) { if (this.current) { this.current.middle = v; } },
};


/* =====================================================================
   12. WHATSAPP SHARING  (wa.me link + clipboard copy; the text itself is built offline)
   ===================================================================== */
const WA = {
  /** Sri Lanka style numbers (07x...) become 947x... ; other numbers keep their digits. */
  number(raw) {
    let d = String(raw || '').replace(/\D/g, '');
    if (d.startsWith('00')) d = d.slice(2);
    if (d.startsWith('0')) d = `94${d.slice(1)}`;
    return d;
  },
  url(text, phone = '') { const n = this.number(phone); return `https://wa.me/${n}?text=${encodeURIComponent(text)}`; },
  async copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.className = 'fixed -left-96 top-0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch { /* ignore */ }
      ta.remove(); return ok;
    }
  },
  /** Open WhatsApp with the message ready. The text is also copied, so it still works if the link cannot open offline. */
  async send(text, phone = '') {
    const copied = await this.copy(text);
    window.open(this.url(text, phone), '_blank', 'noopener');
    Toast.show(`Opening WhatsApp${copied ? '. The text is also copied' : ''}. WhatsApp needs internet to send.`, 'info', { ms: 5000 });
  },

  dailyText(key) {
    const co = S.companySettings, sales = Analytics.salesOn(key), sum = Analytics.summary(sales), by = Analytics.byMethod(sales);
    const top = Analytics.productStats(sales).sort((a, b) => b.qty - a.qty).slice(0, 5);
    const cur = co.currency, n = (v) => `${cur} ${fmtNum(v)}`;
    const lines = [
      `*${co.name}*`, `Daily Sales Report  ${fmtDate(`${key}T12:00:00`)}`, '',
      `Bills: ${sum.orders}`, `Items sold: ${sum.items}`, `*Total sales: ${n(sum.revenue)}*`, `Profit: ${n(sum.profit)}`, '',
      '*By payment method*',
      ...PAY_METHODS.map((m) => `${m.label}: ${n(by[m.id]?.total || 0)} (${by[m.id]?.count || 0})`), '',
    ];
    const credit = sales.reduce((a, s) => a + saleDue(s), 0);
    if (credit > 0) lines.push(`Credit given today (unpaid): ${n(credit)}`);
    lines.push(`Total credit outstanding: ${n(Analytics.creditDue())}`, '');
    if (top.length) lines.push('*Top items*', ...top.map((t, i) => `${i + 1}. ${t.name} x${t.qty}`));
    if (!sales.length) lines.push('No sales recorded for this day.');
    return lines.join('\n').trim();
  },
  billText(sale) {
    const co = S.companySettings, n = (v) => `${co.currency} ${fmtNum(v)}`;
    const due = saleDue(sale);
    return [
      `*${co.name}*`, co.address, `Tel: ${co.phone}`, '',
      `Invoice: ${sale.invoiceNo}`, `Date: ${fmtDateTime(sale.date)}`, sale.customerName ? `Customer: ${sale.customerName}` : '', '',
      ...sale.items.map((i) => `${i.name}  ${i.qty} x ${fmtNum(i.price)} = ${fmtNum(i.qty * i.price)}`), '',
      sale.discount > 0 ? `Discount: -${n(sale.discount)}` : '', sale.tax > 0 ? `${sale.taxName || 'Tax'}: ${n(sale.tax)}` : '',
      `*Total: ${n(sale.total)}*`, `Payment: ${sale.method}`, due > 0 ? `*Balance due: ${n(due)}*` : '', '', co.footer,
    ].filter((l, i, a) => !(l === '' && a[i - 1] === '')).join('\n').trim();
  },
  reminderText(c) {
    const co = S.companySettings;
    return `Dear ${c.name},\nThis is a friendly reminder that you have an outstanding balance of ${co.currency} ${fmtNum(c.due)} at ${co.name}. Thank you.`;
  },
};

/** Smooth sparkline drawn as inline SVG (attributes only). */
const sparkline = (vals) => {
  const W = 200, H = 60, max = Math.max(...vals, 1), step = W / Math.max(vals.length - 1, 1);
  const pts = vals.map((v, i) => [Math.round(i * step), Math.round(H - 6 - (v / max) * (H - 14))]);
  const line = pts.map((p) => p.join(',')).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="h-16 w-full text-onprimary" aria-hidden="true">
    <polygon points="0,${H} ${line} ${W},${H}" class="fill-current opacity-15"/>
    <polyline points="${line}" vector-effect="non-scaling-stroke" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fill-none stroke-current opacity-90"/>
    ${pts.length ? `<circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3.5" class="fill-current"/>` : ''}
  </svg>`;
};

const Forms = {};
Forms.product = (form) => {
  const f = Object.fromEntries(new FormData(form));
  const name = String(f.name || '').trim();
  if (!name) return Toast.show('Product name is required', 'error');
  if (f.price === '' || num(f.price) < 0) return Toast.show('Enter a valid selling price', 'error');
  const category = Products.ensureCategory(String(f.newCategory || '').trim() || f.category || 'General');
  const sku = String(f.sku || '').trim() || Products.autoSku();
  const barcode = String(f.barcode || '').trim();
  const others = S.products.filter((p) => p.id !== f.id);
  if (others.some((p) => p.sku.toLowerCase() === sku.toLowerCase())) return Toast.show(`SKU "${sku}" is already used`, 'error');
  if (barcode && others.some((p) => p.barcode === barcode)) return Toast.show(`Barcode "${barcode}" is already used`, 'error');
  const existing = f.id ? findProduct(f.id) : null;
  const next = Products.normalize({ ...existing, ...f, id: existing ? existing.id : uid(), name, category, sku, barcode });
  Products.commit(next, existing);
  Store.save('products', 'deleted');
  Modal.close();
  Toast.show(existing ? 'Product updated' : 'Product added', 'success');
  Router.refresh();
};

Forms.category = (form) => {

/** Look a typed/scanned code up by barcode or SKU, or by a single search match. */
const findByCode = (q, { allowSearch = false } = {}) => {
  const ql = q.trim().toLowerCase();
  if (!ql) return null;
  const exact = S.products.find((p) => (p.barcode && p.barcode.toLowerCase() === ql) || (p.sku && p.sku.toLowerCase() === ql));
  if (exact || !allowSearch) return exact || null;
  const matches = filteredProducts(q, 'all');
  return matches.length === 1 ? matches[0] : null;
};

const posAddByQuery = () => {
  POS.q = $('#pos-search').value;   // read the live value: scanners type + press Enter faster than the search debounce
  const q = POS.q.trim();
  if (!q) return;
  const pick = findByCode(q, { allowSearch: true });
  if (!pick) {
    const n = filteredProducts(q, 'all').length;
    return Toast.show(n ? 'Several matches. Tap a product to add it.' : `No product found for "${q}"`, n ? 'info' : 'error');
  }
  if (Cart.add(pick)) { POS.q = ''; $('#pos-search').value = ''; renderPosGrid(); renderCart(); }
};

const completeSaleFlow = async () => {
  const btn = $('#btn-complete');
  if (!btn || btn.dataset.busy) return;
  const c = Cart.st;
  if (!c.items.length) return Toast.show('Add items to the cart first', 'warn');
  const t = Cart.totals();
  if (c.method === 'Cash' && t.cash !== null && t.cash + 0.0001 < t.total) { Toast.show(`Cash received is short by ${money(t.total - t.cash)}`, 'error'); $('#cash-input').focus(); return; }
  if (c.method === 'Credit' && !String(c.customer?.name || '').trim()) { Toast.show('Enter the customer name for a credit sale', 'error'); $('#cust-name').focus(); return; }
  btn.dataset.busy = '1'; btn.disabled = true;
  const prev = btn.innerHTML;
  btn.innerHTML = '<span class="h-5 w-5 animate-spin rounded-full border-2 border-current border-t-transparent"></span> Saving...';
  await new Promise((r) => setTimeout(r, 300));
  try {
    const sale = Sales.complete();
    const lowNow = sale.items.map((i) => findProduct(i.id)).filter((p) => p && isLow(p));
    const pr = PR();
    if (pr.mode === 'none') Toast.show(`Sale ${sale.invoiceNo} saved`, 'success', { label: 'View bill', ms: 7000, action: () => Receipt.show(sale) });
    else {
      Receipt.show(sale, { afterSale: true });
      if (pr.mode === 'bill') Receipt.print(sale, billSize());
      else if (pr.mode === 'invoice') Receipt.print(sale, pr.invoice);
      else if (pr.mode === 'both') Receipt.printQueue(sale, [billSize(), pr.invoice]);
    }
    if (lowNow.length) Toast.show(`Low stock: ${lowNow.map((p) => `${p.name} (${Math.max(0, p.stock)})`).join(', ')}`, 'warn', { ms: 6000 });
  } catch (e) {
    Toast.show(e.message, 'error', { ms: 5000 });
  }
  const b2 = $('#btn-complete');
  if (b2) { delete b2.dataset.busy; b2.innerHTML = prev; }
  Router.refresh();
};

    </form>`, { size: 'max-w-md' });
};
Forms.payment = (form) => {
  const f = Object.fromEntries(new FormData(form));
  try {
    const s = Sales.addPayment(f.id, f.method, f.amount);
    Modal.close();
    Toast.show(saleDue(s) > 0 ? `Payment saved. ${money(saleDue(s))} still due` : 'Payment saved. Bill fully paid', 'success');
    Router.current() === 'sales' ? renderSalesList() : Router.refresh();
  } catch (e) { Toast.show(e.message, 'error'); }
};


/* =====================================================================

const REP = { period: 'today', day: '' };
const PERIODS = [['today', "Today's Report"], ['week', 'Weekly Report'], ['month', 'Monthly Report']];
const repDay = () => REP.day || dayKey(new Date());

const rankList = (rows, valueLabel) => {
  if (!rows.length) return `<p class="py-6 text-center text-sm ${C.muted}">No data for this period.</p>`;
  const max = Math.max(...rows.map((r) => r.qty), 1);
  return `<ol class="space-y-3.5">${rows.map((r, i) => `
    <li><div class="mb-1 flex items-center justify-between gap-2 text-sm"><span class="min-w-0 truncate font-semibold"><span class="mr-2 inline-flex h-5 w-5 items-center justify-center rounded-full bg-primary-500/15 text-[11px] font-extrabold text-primary-700 dark:text-primary-300">${i + 1}</span>${esc(r.name)}</span><span class="shrink-0 text-xs font-semibold ${C.muted}">${r.qty} ${valueLabel} · ${money(r.revenue)}</span></div>${hbar((r.qty / max) * 100)}</li>`).join('')}</ol>`;
};

Views.reports = () => {
  const sales = Analytics.salesIn(REP.period);
  const sum = Analytics.summary(sales);
  const stats = Analytics.productStats(sales);
  const most = [...stats].sort((a, b) => b.qty - a.qty).slice(0, 8);
  const byId = new Map(stats.map((s) => [s.id, s]));
  const least = S.products.map((p) => byId.get(p.id) || { id: p.id, name: p.name, qty: 0, revenue: 0 })
    .sort((a, b) => a.qty - b.qty || a.name.localeCompare(b.name)).slice(0, 8);
  const cats = Analytics.categorySales(sales);
  const catMax = Math.max(...cats.map((c) => c.revenue), 1);
  const hourly = Analytics.hourly(sales);
  const hours = hourly.map((_, h) => (h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h - 12}p`));
  const days = REP.period === 'month' ? new Date().getDate() : 7;
  const daily = Analytics.daily(sales, Math.max(days, 1));
  const by = Analytics.byMethod(sales);
  const byMax = Math.max(...Object.values(by).map((m) => m.total), 1);
  const credit = Customers.list().filter((c) => c.due > 0).sort((a, b) => b.due - a.due);
  const card = (label, value, tone) => `<div class="${C.card} !p-4"><p class="text-[11px] font-bold uppercase tracking-wider ${C.muted}">${label}</p><p class="mt-1 text-xl font-extrabold tabular-nums tracking-tight ${tone}">${value}</p></div>`;
  return `<div class="animate-fade space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="inline-flex rounded-full p-1 border border-white/60 bg-white/35 backdrop-saturate-150 inset-shadow-xs inset-shadow-white/80 ring-1 ring-inset ring-white/30 dark:border-white/15 dark:bg-white/[0.08] dark:inset-shadow-white/20 dark:ring-white/5">
        ${PERIODS.map(([id, label]) => `<button type="button" data-action="rep-period" data-p="${id}" class="rounded-xl px-3.5 py-2 text-sm font-bold transition ${REP.period === id ? C.chipOn : 'text-slate-600 hover:bg-slate-900/5 dark:text-slate-300 dark:hover:bg-white/10'}">${label}</button>`).join('')}
      </div>
      <button type="button" data-action="rep-print" class="${C.btnGhost}">${icon('printer', 'h-4 w-4')} Print report</button>
    </div>
    <div class="grid grid-cols-2 gap-3 xl:grid-cols-5">
      ${card('Revenue', money(sum.revenue), 'text-primary-600 dark:text-primary-300')}
      ${card('Profit', money(sum.profit), 'text-emerald-600 dark:text-emerald-400')}
      ${card('Transactions', sum.orders, '')}
      ${card('Average sale', money(sum.avg), '')}
      ${card('Items sold', sum.items, '')}
    </div>

    <section class="${C.card}">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div><h2 class="${C.h2} flex items-center gap-2">${icon('chat', 'h-5 w-5 text-green-600')} Daily report for WhatsApp</h2><p class="text-xs ${C.muted}">Pick a day, then send the summary to yourself, a partner or a group.</p></div>
        <input type="date" data-input="rep-day" value="${esc(repDay())}" class="${C.input} !w-auto" aria-label="Report date">
      </div>
      <pre id="wa-preview" class="mt-3 max-h-64 overflow-auto whitespace-pre-wrap rounded-2xl bg-slate-900/[0.04] p-4 font-sans text-sm leading-relaxed dark:bg-white/5">${esc(WA.dailyText(repDay()))}</pre>
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" data-action="wa-daily" class="${C.btnWa}">${icon('chat', 'h-4 w-4')} Share on WhatsApp</button>
        <button type="button" data-action="wa-copy" class="${C.btnGhost}">${icon('copy', 'h-4 w-4')} Copy text</button>
        <button type="button" data-action="rep-day-xlsx" class="${C.btnGhost}">${icon('table', 'h-4 w-4')} Day to Excel</button>
      </div>
      ${S.companySettings.whatsapp ? `<p class="mt-2 text-xs ${C.muted}">Sends to ${esc(S.companySettings.whatsapp)} (change it in Settings).</p>` : `<p class="mt-2 text-xs ${C.muted}">Tip: add your WhatsApp number in Settings to send the report straight to that chat.</p>`}
    </section>

    <div class="grid gap-4 lg:grid-cols-2">
      <section class="${C.card}"><h2 class="${C.h2} mb-3">Payment methods</h2>
        <div class="space-y-3.5">${PAY_METHODS.map((m) => `<div><div class="mb-1 flex items-center justify-between gap-2 text-sm"><span class="flex items-center gap-2 font-semibold">${icon(m.icon, 'h-4 w-4 text-primary-600 dark:text-primary-300')}${m.label}</span><span class="text-xs font-semibold ${C.muted}">${by[m.id].count} bills · <b class="text-sm text-slate-900 dark:text-white">${money(by[m.id].total)}</b></span></div>${hbar((by[m.id].total / byMax) * 100)}</div>`).join('')}</div>
      </section>
      <section class="${C.card}"><h2 class="${C.h2} mb-3 flex items-center justify-between">Credit outstanding <span class="text-sm text-red-600 dark:text-red-400">${money(Analytics.creditDue())}</span></h2>
        ${credit.length ? `<ul class="divide-y divide-slate-200/70 dark:divide-slate-700/60">${credit.slice(0, 8).map((c) => `<li class="flex items-center gap-2 py-2"><div class="min-w-0 flex-1"><p class="truncate text-sm font-bold">${esc(c.name)}</p><p class="text-xs ${C.muted}">${esc(c.phone) || 'No phone'} · ${c.bills} bills</p></div><p class="text-sm font-extrabold tabular-nums text-red-600 dark:text-red-400">${money(c.due)}</p>${c.phone ? `<button type="button" data-action="wa-remind" data-name="${esc(c.name)}" class="${C.iconBtn} !text-green-600" aria-label="WhatsApp reminder" title="Send reminder">${icon('chat', 'h-4 w-4')}</button>` : ''}</li>`).join('')}</ul>`
          : `<p class="py-6 text-center text-sm ${C.muted}">No unpaid credit. Nice.</p>`}
      </section>
      <section class="${C.card}"><h2 class="${C.h2} mb-2">Hourly sales</h2>${barChart(hourly, hours, { step: 3, fmt: money })}</section>
      <section class="${C.card}"><h2 class="${C.h2} mb-2">${REP.period === 'month' ? 'Daily revenue (this month)' : 'Daily revenue (last 7 days)'}</h2>${barChart(daily.map((d) => d.total), daily.map((d) => d.label), { fmt: money, cls: 'fill-emerald-500' })}</section>
      <section class="${C.card}"><h2 class="${C.h2} mb-3">Most sold products</h2>${rankList(most, 'sold')}</section>
      <section class="${C.card}"><h2 class="${C.h2} mb-3">Least sold products</h2>${S.products.length ? rankList(least, 'sold') : `<p class="py-6 text-center text-sm ${C.muted}">No products yet.</p>`}</section>
      <section class="${C.card} lg:col-span-2"><h2 class="${C.h2} mb-3">Category sales</h2>
        ${cats.length ? `<div class="grid gap-3.5 sm:grid-cols-2">${cats.map((c) => `<div><div class="mb-1 flex justify-between gap-2 text-sm"><span class="truncate font-semibold">${esc(c.name)}</span><span class="shrink-0 text-xs font-semibold ${C.muted}">${c.qty} ${c.qty === 1 ? 'item' : 'items'} · ${money(c.revenue)}</span></div>${hbar((c.revenue / catMax) * 100)}</div>`).join('')}</div>`
          : `<p class="py-6 text-center text-sm ${C.muted}">No data for this period.</p>`}
      </section>
    </div>
  </div>`;
};

const Backup = {
  /** Backups never contain this device's connection secrets (sync secret, script token, bot tokens). */
  build() {
    const data = Object.fromEntries(KEYS.filter((k) => k !== 'device').map((k) => [k, S[k]]));
    data.companySettings = { ...data.companySettings }; SECRET_SETTINGS.forEach((k) => { delete data.companySettings[k]; });
    return { app: APP_ID, version: 2, exportedAt: new Date().toISOString(), data };
  },
  stamp() { return dayKey(new Date()); },
  /** Backup with the order photos included. */
  async full() { const d = this.build(); d.photos = await Photos.all(Orders.photoIds()); return d; },
  applyAll(data) {
    data = Clean.snapshotData(Clean.data(data));
    const keepSecrets = Object.fromEntries(SECRET_SETTINGS.map((k) => [k, S.companySettings[k] || '']));
    const keepDevice = S.device;
    const def = DEFAULTS();
    KEYS.forEach((k) => {
      const v = data[k];
      const ok = v !== undefined && (Array.isArray(def[k]) ? Array.isArray(v) : isPlainObject(def[k]) ? isPlainObject(v) : typeof v === typeof def[k]);
      if (ok) S[k] = isPlainObject(def[k]) ? { ...def[k], ...v } : v;
    });
    S.device = keepDevice;   // connections, tokens and the PIN belong to this device, never to a backup file
    SECRET_SETTINGS.forEach((k) => { if (!S.companySettings[k]) S.companySettings[k] = keepSecrets[k]; });
    if (!S.device.id) S.device.id = uid();
    Inventory.migrate(); migrateReminderKeys();
    Store.saveAll();
  },
};

/** Hidden file picker helper: resolves with an array of chosen Files (empty if cancelled). */
const pickFile = (accept, multiple = false) => new Promise((resolve) => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = accept; input.multiple = multiple; input.className = 'hidden';
  input.addEventListener('change', () => { resolve([...input.files]); input.remove(); });
  input.addEventListener('cancel', () => { resolve([]); input.remove(); });
  document.body.appendChild(input);
  input.click();
});

const importProducts = async () => {
  const [file] = await pickFile('.json,application/json');
  if (!file) return;
  try {
    const json = await readJSONFile(file);
    const rawList = Array.isArray(json) ? json : Array.isArray(json?.products) ? json.products : null;
    if (!rawList) throw new Error('No products found in that file');
    const items = rawList.map((r) => Products.normalize(r || {})).filter(Boolean);
    if (!items.length) throw new Error('The file has no valid products');
    const mode = await Modal.choice('Import products', `${items.length} products found. Merge keeps your current products and updates matches (same ID or SKU). Replace deletes the current list first.`, [
      { label: 'Cancel', value: 'cancel', cls: C.btnGhost },
      { label: 'Replace all', value: 'replace', cls: C.btnDanger },
      { label: 'Merge', value: 'merge', cls: C.btn },
    ]);
    if (!mode || mode === 'cancel') return;
    if (mode === 'replace') { S.products.forEach((p) => { S.deleted.products[p.id] = Date.now(); }); S.products = []; }
    let added = 0, updated = 0;
    items.forEach((it) => {
      const hit = S.products.find((p) => p.id === it.id || (it.sku && p.sku === it.sku));
      if (hit) { Products.commit({ ...it, id: hit.id }, hit); updated++; }
      else { if (!it.sku) it.sku = Products.autoSku(); Products.commit(it); added++; }
      Products.ensureCategory(it.category);
    });
    if (Array.isArray(json?.categories)) json.categories.forEach((c) => Products.ensureCategory(c));
    Store.save('products', 'categories', 'deleted');
    Toast.show(`Imported: ${added} added, ${updated} updated`, 'success');
    Router.refresh();
  } catch (e) { Toast.show(e.message, 'error'); }
};

const restoreBackup = async () => {
  const [file] = await pickFile('.json,application/json');
  if (!file) return;
  try {
    const json = await readJSONFile(file);
    const data = json?.data;
    if (!isPlainObject(data) || (!Array.isArray(data.products) && !Array.isArray(data.sales))) throw new Error('That is not a POS backup file');
    const ok = await Modal.confirm(`This replaces everything in the system with the backup from ${json.exportedAt ? fmtDateTime(json.exportedAt) : 'the file'}. Current data will be lost.`, { title: 'Restore backup?', okText: 'Restore', danger: true });
    if (!ok) return;
    Backup.applyAll(data);
    await Photos.putMany(json.photos);
    Theme.apply(); Shell.render(); Router.refresh();
    Toast.show('Backup restored', 'success');
  } catch (e) { Toast.show(e.message, 'error'); }
};

const importSyncFiles = async () => {
  const files = await pickFile('.json,application/json', true);
  if (!files.length) return;
  let total = 0; const names = [];
  for (const file of files) {
    try {
      const st = Sync.merge(await readJSONFile(file));
      total += st.total; names.push(Sync.describe(st));
    } catch (e) { Toast.show(`${file.name}: ${e.message}`, 'error'); }
  }
  if (names.length) Toast.show(total ? `Merged: ${names.join(' | ')}` : 'Already up to date. Nothing new in that file', total ? 'success' : 'info', { ms: 6000 });
  Router.refresh();
};

/* =====================================================================
   22. BARCODE SCANNER  (USB / Bluetooth scanners act like a very fast keyboard)
   ===================================================================== */
const beep = (ok = true) => {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = ok ? 1100 : 220; g.gain.value = 0.07;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (ok ? 0.08 : 0.25));
  } catch { /* sound is optional */ }
};

const Scanner = {
  buf: '', last: 0, timer: null,
  reset() { this.buf = ''; clearTimeout(this.timer); },
  /** Add the scanned product to the cart (or complain), and clear the search box. */
  commit() {
    const code = this.buf;
    this.reset();
    const p = findByCode(code);
    const s = $('#pos-search');
    if (s && s.value) { s.value = ''; POS.q = ''; renderPosGrid(); }
    if (!p) { beep(false); Toast.show(`No product with barcode "${code}"`, 'error'); return; }
    if (Cart.add(p)) { renderCart(); beep(true); Toast.show(`Added: ${p.name}`, 'success', { ms: 1400 }); } else beep(false);
  },
  onKey(e) {
    if (Lock.locked || Router.current() !== 'pos' || Modal.top) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const t = e.target;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.id !== 'pos-search') return;
    if (e.key === 'Enter') {
      if (this.buf.length >= 3) { e.preventDefault(); e.stopPropagation(); this.commit(); } else this.reset();
      return;
    }
    if (e.key.length !== 1) return;
    const now = performance.now();
    if (this.buf && now - this.last > 60) this.buf = '';   // slower than a scanner: it is a person typing
    this.buf += e.key; this.last = now;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {                         // scanners without an Enter suffix
      if (this.buf.length >= 4 && findByCode(this.buf)) this.commit(); else this.buf = '';
    }, 160);
  },
};
