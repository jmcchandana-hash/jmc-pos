const isPlainObject = (v) => v && typeof v === 'object' && !Array.isArray(v);

const Store = {
  data: {},
  /** Load every key from localStorage, falling back to defaults (and persisting them). */
  load() {
    const def = DEFAULTS();
    KEYS.forEach((k) => {
      let v;
      try { const raw = localStorage.getItem(k); v = raw === null ? undefined : JSON.parse(raw); } catch { v = undefined; }
      const wantsObject = isPlainObject(def[k]);
      const wantsArray = Array.isArray(def[k]);
      if (v === undefined || (wantsObject && !isPlainObject(v)) || (wantsArray && !Array.isArray(v)) || (!wantsObject && !wantsArray && typeof v !== typeof def[k])) {
        this.data[k] = def[k];
        this.save(k);
      } else {
        this.data[k] = wantsObject ? { ...def[k], ...v } : v;
      }
    });
  },
  /** Optional hook (set by the folder-sync module) called when synced data changes. */
  onChange: null,
  save(...keys) {
    keys.forEach((k) => {
      try { localStorage.setItem(k, JSON.stringify(this.data[k])); }
      catch { Toast.show('Browser storage is full. Export a backup and remove images or old sales.', 'error', { ms: 6000 }); }
    });
    if (this.onChange && keys.some((k) => ['products', 'sales', 'orders', 'deleted', 'categories', 'companySettings'].includes(k))) this.onChange();
    if (keys.some((k) => k === 'orders' || k === 'companySettings')) { try { AutoMail.queueOrders(); } catch { /* not ready yet */ } }
  },
  saveAll() { this.save(...KEYS); },
  /** Approximate bytes used by this app in localStorage. */
  usedBytes() {
    let n = 0;
    KEYS.forEach((k) => { const v = localStorage.getItem(k); if (v) n += (k.length + v.length) * 2; });
    return n;
  },
};

  apply() {
    const { mode, color } = S.theme;
    if (S.theme.gv !== 2) {   // older saved levels (1-5) become percentages / pixels
      S.theme.glass = [10, 20, 30, 50, 82][Math.min(4, Math.max(0, Math.round(num(S.theme.glass) || 3) - 1))];
      S.theme.blur = [0, 8, 20, 40, 64][Math.min(4, Math.max(0, Math.round(S.theme.blur === undefined ? 3 : num(S.theme.blur))))];
      S.theme.gv = 2; Store.save('theme');

    const bl = Math.min(80, Math.max(0, Math.round(num(S.theme.blur))));
    let st = document.getElementById('glass-vars');
    if (!st) { st = document.createElement('style'); st.id = 'glass-vars'; document.head.appendChild(st); }
    const cl = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Math.round(num(v === undefined ? d : v))));

};

Offline (නැවත උත්සාහ කරයි)", "Problem": "ගැටලුවක්", "Connected": "සම්බන්ධයි", "Permission needed": "අවසරය අවශ්‍යයි", "Sync now": "දැන් සමමුහුර්ත කරන්න", "Copy link code": "Link code පිටපත් කරන්න", "Send link code on WhatsApp": "Link code එක WhatsApp හරහා යවන්න", "Disconnect": "විසන්ධි කරන්න", "On the other device open Data & Sync, choose \"Join with link code\" and paste it. Anyone with the link code can see all shop data, so share it only with your staff.": "අනෙක් උපාංගයේ Data & Sync විවෘත කර \"Join with link code\" එකට එය paste කරන්න. Link code එක ඇති ඕනෑම අයෙකුට කඩේ සියලු දත්ත බලාගත හැකි නිසා එය ඔබේ කාර්ය මණ්ඩලයට පමණක් දෙන්න.", "Other ways to share (no internet)": "බෙදාගැනීමේ වෙනත් ක්‍රම (internet නැතිව)", "This device": "මෙම උපාංගය", "Every device keeps its own offline copy. Syncing merges the sales, products and credit payments from all devices, so everyone sees the same data and the same stock.": "සෑම උපාංගයක්ම තමන්ගේම offline පිටපතක් තබාගනී. සමමුහුර්ත කිරීමෙන් සියලු උපාංගවල විකුණුම්, භාණ්ඩ සහ ණය ගෙවීම් ඒකාබද්ධ වන නිසා සැමට එකම දත්ත සහ එකම තොගය පෙනේ.", "Automatic sync (shared folder)": "ස්වයංක්‍රීය සමමුහුර්තය (හවුල් ෆෝල්ඩරය)", "Works in Chrome or Edge on PC / laptop. Put one folder where all devices can reach it (Dropbox, OneDrive, Google Drive for desktop, a network share or a USB drive), then choose that folder on each device. Each device writes its own small file there and merges the others every few seconds.": "PC / laptop හි Chrome හෝ Edge වල වැඩ කරයි. සියලු උපාංගවලට ළඟා විය හැකි ෆෝල්ඩරයක් (Dropbox, OneDrive, Google Drive, network share හෝ USB) තෝරා සෑම උපාංගයකම එම ෆෝල්ඩරය තෝරන්න. සෑම උපාංගයක්ම තමන්ගේ කුඩා ගොනුවක් එහි ලියා තත්පර කිහිපයකට වරක් අනෙක් ඒවා ඒකාබද්ධ කරයි.", "Choose sync folder": "සමමුහුර්ත ෆෝල්ඩරය තෝරන්න", "Allow access": "ප්‍රවේශයට ඉඩ දෙන්න", "Sync file (any device, no internet)": "සමමුහුර්ත ගොනුව (ඕනෑම උපාංගයක්, internet නැතිව)", "Export a sync file on one device, send it (WhatsApp, USB, email) and import it on the other. Importing merges; nothing is overwritten. Do it both ways to bring two devices fully in line.": "එක් උපාංගයක සමමුහුර්ත ගොනුවක් export කර (WhatsApp, USB, email) අනෙක් උපාංගයේ import කරන්න. Import කිරීමෙන් ඒකාබද්ධ වේ; කිසිවක් උඩින් නොලියවේ. උපාංග දෙක සම්පූර්ණයෙන් සමාන කිරීමට දෙපැත්තෙන්ම කරන්න.", "Export sync file": "සමමුහුර්ත ගොනුව export කරන්න", "Import and merge": "Import කර ඒකාබද්ධ කරන්න", "Stock stays correct.": "තොගය නිවැරදිව පවතී.", "It is calculated from all merged sales, so two devices selling the same item both count.": "එය ඒකාබද්ධ වූ සියලු විකුණුම් වලින් ගණනය වන නිසා එකම භාණ්ඩය උපාංග දෙකකින් විකුණුවත් දෙකම ගණන් ගැනේ.", "Invoice numbers.": "ඉන්වොයිස් අංක.", "Give each device a code in Settings (A, B...). If two bills still share a number, the older keeps it.": "Settings හි සෑම උපාංගයකටම කේතයක් දෙන්න (A, B...). බිල් දෙකකට එකම අංකය තිබුණොත් පැරණි එක එය රඳවා ගනී.", "Edits.": "සංස්කරණ.", "If the same product is edited on two devices, the most recent edit wins. Keep device clocks correct.": "එකම භාණ්ඩය උපාංග දෙකකින් සංස්කරණය කළොත් අලුත්ම සංස්කරණය ජයගනී. උපාංගවල ඔරලෝසු නිවැරදිව තබන්න.", "Export products (JSON)": "භාණ්ඩ export කරන්න (JSON)", "Import products (JSON)": "භාණ්ඩ import කරන්න (JSON)", "Export all sales to Excel (.xlsx)": "සියලු විකුණුම් Excel (.xlsx) වලට export කරන්න", "Export sales (JSON)": "විකුණුම් export කරන්න (JSON)", "Customer WhatsApp numbers": "පාරිභෝගික WhatsApp අංක", "Every number collected from bills, credit sales and orders, with the customer name, in one Excel file. Each number appears once.": "බිල්පත්, ණය විකුණුම් සහ ඇණවුම් වලින් ලැබුණු සියලු අංක, පාරිභෝගිකයාගේ නම සමඟ, එකම Excel ගොනුවක. සෑම අංකයක්ම එක් වරක් පමණක් පෙන්වයි.", "Export names + numbers to Excel": "නම් + අංක Excel වලට export කරන්න", "Save as phone contacts (.vcf)": "Phone contacts ලෙස සුරකින්න (.vcf)", "Full system backup": "සම්පූර්ණ පද්ධති backup", "Backup includes products, categories, sales, invoices, settings and theme. Keep a copy somewhere safe (USB drive or phone), because browser data can be const Toast = {
  show(msg, type = 'info', { action = null, label = 'Undo', ms = 3500 } = {}) {
    const root = $('#toast-root');
    if (!root) return;
    const tones = {
      success: 'border-emerald-500/40 bg-emerald-50/95 text-emerald-900 dark:bg-emerald-950/90 dark:text-emerald-100',
      error: 'border-red-500/40 bg-red-50/95 text-red-900 dark:bg-red-950/90 dark:text-red-100',
      warn: 'border-amber-500/40 bg-amber-50/95 text-amber-900 dark:bg-amber-950/90 dark:text-amber-100',
      info: 'border-slate-300 bg-white/95 text-slate-800 dark:border-slate-600 dark:bg-slate-800/95 dark:text-slate-100',
    };
    const el = document.createElement('div');
    el.className = `pointer-events-auto flex items-center gap-3 rounded-full border px-5 py-3 text-sm font-medium shadow-xl inset-shadow-xs inset-shadow-white/60 animate-toast ${tones[type] || tones.info}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `<span class="min-w-0 flex-1 break-words">${esc(msg)}</span>` +
      (action ? `<button type="button" data-action="toast-action" class="shrink-0 rounded-lg px-2 py-1 text-xs font-bold uppercase tracking-wide underline">${esc(label)}</button>` : '') +
      `<button type="button" data-action="toast-close" aria-label="Dismiss" class="shrink-0 opacity-60 hover:opacity-100">${icon('x', 'h-4 w-4')}</button>`;
    el.__action = action;
    root.appendChild(el);
    while (root.children.length > 4) root.firstChild.remove();
    setTimeout(() => el.remove(), action ? Math.max(ms, 7000) : ms);
  },
};

const Modal = {
  resolvers: {},
  stack: [],
  open(html, { size = 'max-w-lg', onClose = null } = {}) {
    const id = uid();
    const wrap = document.createElement('div');
    wrap.dataset.modal = id;
    wrap.className = 'fixed inset-0 z-50 flex items-end justify-center bg-slate-900/30 backdrop-blur-md animate-fade sm:items-center sm:p-4';
    wrap.innerHTML = `<div role="dialog" aria-modal="true" class="max-h-[92vh] w-full ${size} animate-slide overflow-y-auto rounded-t-[2rem] sm:rounded-[2rem] border border-white/60 bg-white/(--g-a) backdrop-blur-(--g-blur) backdrop-saturate-200 inset-shadow-sm inset-shadow-white/80 shadow-2xl shadow-indigo-900/10 ring-1 ring-inset ring-white/40 dark:border-white/15 dark:bg-white/(--g-ad) dark:inset-shadow-white/20 dark:shadow-black/40 dark:ring-white/10 !bg-white/70 dark:!bg-slate-900/70"><div class="mx-auto mt-2 h-1.5 w-10 rounded-full bg-slate-400/50 sm:hidden"></div>${html}</div>`;
    $('#modal-root').appendChild(wrap);
    Photos.hydrate(wrap);
    this.stack.push({ id, el: wrap, onClose });
    const focusEl = $('[autofocus]', wrap) || $('input:not([type=hidden]):not([type=file]), select, textarea', wrap);
    if (focusEl && !window.matchMedia('(pointer: coarse)').matches) setTimeout(() => focusEl.focus(), 30);
    return id;
  },
  close(id) {
    const i = id ? this.stack.findIndex((m) => m.id === id) : this.stack.length - 1;
    if (i < 0) return;
    const [m] = this.stack.splice(i, 1);
    m.el.remove();
    delete this.resolvers[m.id];
    if (m.onClose) m.onClose();
  },
  closeAll() { while (this.stack.length) this.close(); },
  get top() { return this.stack[this.stack.length - 1]; },
  /** Yes/No dialog that resolves to true or false. */
  confirm(message, { title = 'Are you sure?', okText = 'Confirm', danger = false } = {}) {
    return this.choice(title, message, [
      { label: 'Cancel', value: 'no', cls: C.btnGhost },
      { label: okText, value: 'yes', cls: danger ? C.btnDanger : C.btn },
    ]).then((v) => v === 'yes');
  },
  /** Dialog with several buttons; resolves to the chosen value (or null if dismissed). */
  choice(title, message, buttons) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const btns = buttons.map((b) => `<button type="button" data-action="modal-resolve" data-value="${esc(b.value)}" class="${b.cls || C.btnGhost}">${esc(b.label)}</button>`).join('');
      const id = this.open(
        `<div class="p-6">
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">${esc(title)}</h3>
          <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">${esc(message)}</p>
          <div class="mt-6 flex flex-wrap justify-end gap-2">${btns}</div>
        </div>`,
        { size: 'max-w-sm', onClose: () => finish(null) }
      );
      this.resolvers[id] = (v) => { finish(v); this.close(id); };
    });
  },
};

/* ---------- Tiny SVG charts (attributes only, no inline styles) ---------- */
const barChart = (vals, labels, { fmt = fmtNum, step = 1, cls = 'fill-primary-500' } = {}) => {
  const n = vals.length, H = 140, slot = 20, W = n * slot;
  const max = Math.max(...vals, 1);
  const bars = vals.map((v, i) => {
    const bh = Math.round((v / max) * (H - 24));
    return `<g><title>${esc(labels[i])}: ${esc(fmt(v))}</title><rect x="${i * slot + 3}" y="${H - 14 - bh}" width="${slot - 6}" height="${v > 0 ? Math.max(bh, 2) : 0}" rx="3" class="${cls}"/></g>`;
  }).join('');
  const txt = labels.map((l, i) => (i % step === 0
    ? `<text x="${i * slot + slot / 2}" y="${H - 2}" text-anchor="middle" class="fill-slate-400 text-[8px]">${esc(l)}</text>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="h-40 w-full" role="img" aria-label="Bar chart">${bars}${txt}</svg>`;
};

const lowLimit = (p) => (p.lowStock === '' || p.lowStock == null ? num(S.companySettings.lowStockDefault) : num(p.lowStock));
const isLow = (p) => num(p.stock) <= lowLimit(p);
const findProduct = (id) => S.products.find((p) => p.id === id);
const sortedCategories = () => [...S.categories].sort((a, b) => a.localeCompare(b));
const invoiceNo = (n) => {
  const cs = S.companySettings;
  return `${cs.invoicePrefix}${cs.deviceCode ? `${cs.deviceCode}-` : ''}${String(n).padStart(6, '0')}`;
};
const salePaid = (s) => round2((s.payments || []).reduce((a, p) => a + num(p.amount), 0));
const saleDue = (s) => Math.max(0, round2(s.total - salePaid(s)));
const methodIcon = (id) => (PAY_METHODS.find((m) => m.id === id) || PAY_METHODS[0]).icon;

/**
 * Stock is DERIVED from the sales ledger:  stock = stockBase - (units sold in every sale we know about).
 * That is what lets several devices agree: once their sales are merged, every device computes the same stock.
 */
const Inventory = {
  soldMap() {
    const m = new Map();
    S.sales.forEach((s) => s.items.forEach((i) => m.set(i.id, (m.get(i.id) || 0) + i.qty)));
    return m;
  },
  sold(id) { let n = 0; S.sales.forEach((s) => s.items.forEach((i) => { if (i.id === id) n += i.qty; })); return n; },
  recalc() {
    const m = this.soldMap();
    S.products.forEach((p) => { p.stock = num(p.stockBase) - (m.get(p.id) || 0); });
  },
  /** Upgrade data saved by older versions (no stockBase / payments / timestamps). */
  migrate() {
    let changed = false;
    const m = this.soldMap();
    S.products.forEach((p) => {
      if (typeof p.stockBase !== 'number') { p.stockBase = num(p.stock) + (m.get(p.id) || 0); changed = true; }
      if (!p.updatedAt) { p.updatedAt = Date.parse(p.createdAt) || Date.now(); changed = true; }
    });
    S.sales.forEach((s) => {
      if (!s.updatedAt) { s.updatedAt = Date.parse(s.date) || Date.now(); changed = true; }
      if (!Array.isArray(s.payments)) {
        s.method = s.method || 'Cash';
        s.payments = [{ id: `p-${s.id}`, method: s.method, amount: s.total, date: s.date }];
        s.customerName = s.customerName || ''; s.customerPhone = s.customerPhone || '';
        changed = true;
      }
    });
    if (!S.device.id) { S.device.id = uid(); Store.save('device'); }
    this.recalc();
    if (changed) Store.save('products', 'sales');
  },
};

const Customers = {
  list() {
    const m = new Map();
    S.sales.forEach((s) => {
      const name = (s.customerName || '').trim();
      if (!name) return;
      const k = name.toLowerCase(), t = new Date(s.date).getTime();
      const r = m.get(k) || { name, phone: '', due: 0, bills: 0, last: 0 };
      if (s.customerPhone && t >= r.last) r.phone = s.customerPhone;
      r.last = Math.max(r.last, t); r.bills += 1; r.due = round2(r.due + saleDue(s));
      m.set(k, r);
    });
    return [...m.values()].sort((a, b) => b.last - a.last);
  },
  find(name) { const k = String(name || '').trim().toLowerCase(); return k ? this.list().find((c) => c.name.toLowerCase() === k) : null; },
};

const Analytics = {
  salesIn(period) {
    const now = new Date();
    return S.sales.filter((s) => {
      const d = new Date(s.date);
      if (period === 'today') return dayKey(d) === dayKey(now);
      if (period === 'week') return d >= new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
      if (period === 'month') return isThisMonth(d);
      return true;
    });
  },
  salesOn(key) { return S.sales.filter((s) => dayKey(s.date) === key); },
  summary(sales) {
    const revenue = round2(sales.reduce((a, s) => a + s.total, 0));
    const profit = round2(sales.reduce((a, s) => a + s.profit, 0));
    const items = sales.reduce((a, s) => a + s.items.reduce((b, i) => b + i.qty, 0), 0);
    return { revenue, profit, orders: sales.length, items, avg: sales.length ? round2(revenue / sales.length) : 0 };
  },
  byMethod(sales) {
    const out = Object.fromEntries(PAY_METHODS.map((m) => [m.id, { count: 0, total: 0 }]));
    sales.forEach((s) => { const r = out[s.method] || (out[s.method] = { count: 0, total: 0 }); r.count += 1; r.total = round2(r.total + s.total); });
    return out;
  },
  creditDue() { return round2(S.sales.reduce((a, s) => a + saleDue(s), 0)); },
  productStats(sales) {
    const m = new Map();
    sales.forEach((s) => s.items.forEach((i) => {
      const r = m.get(i.id) || { id: i.id, name: i.name, category: i.category || 'Uncategorized', qty: 0, revenue: 0 };
      r.qty += i.qty; r.revenue += i.price * i.qty;
      m.set(i.id, r);
    }));
    return [...m.values()];
  },
  categorySales(sales) {
    const m = new Map();
    sales.forEach((s) => s.items.forEach((i) => {
      const k = i.category || 'Uncategorized';
      const r = m.get(k) || { name: k, qty: 0, revenue: 0 };
      r.qty += i.qty; r.revenue += i.price * i.qty;
      m.set(k, r);
    }));
    return [...m.values()].sort((a, b) => b.revenue - a.revenue);
  },
  hourly(sales) {
    const a = Array(24).fill(0);
    sales.forEach((s) => { a[new Date(s.date).getHours()] += s.total; });
    return a.map(round2);
  },
  daily(sales, days) {
    const now = new Date(), out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      out.push({ key: dayKey(d), label: String(d.getDate()), total: 0 });
    }
    const idx = Object.fromEntries(out.map((o, i) => [o.key, i]));
    sales.forEach((s) => { const i = idx[dayKey(s.date)]; if (i !== undefined) out[i].total += s.total; });
    return out.map((o) => ({ ...o, total: round2(o.total) }));
  },
  /** Persist a per-day summary in the "reports" key. */
  rebuildReports() {
    const byDay = {};
    S.sales.forEach((s) => {
      const k = dayKey(s.date);
      const r = byDay[k] || (byDay[k] = { revenue: 0, profit: 0, orders: 0 });
      r.revenue = round2(r.revenue + s.total); r.profit = round2(r.profit + s.profit); r.orders += 1;
    });
    S.reports = { updatedAt: new Date().toISOString(), byDay };
    Store.save('reports');
  },
};

/* =====================================================================
   8. CART
   ===================================================================== */
const Cart = {
  get st() { return S.cart; },
  save() { Store.save('cart'); },
  count() { return this.st.items.reduce((a, i) => a + i.qty, 0); },
  totals() {
    const c = this.st;
    const subtotal = round2(c.items.reduce((a, i) => a + i.price * i.qty, 0));
    const dv = Math.max(num(c.discValue), 0);
    const discount = round2(c.discType === 'percent' ? (subtotal * Math.min(dv, 100)) / 100 : Math.min(dv, subtotal));
    const taxable = round2(subtotal - discount);
    const rate = num(S.companySettings.taxRate);
    const tax = round2((taxable * rate) / 100);
    const total = round2(taxable + tax);
    const cost = c.items.reduce((a, i) => a + i.cost * i.qty, 0);
    const profit = round2(subtotal - discount - cost);
    const cash = c.cash === '' ? null : num(c.cash);
    const balance = cash === null ? 0 : round2(cash - total);
    const advance = Math.min(Math.max(num(c.advance), 0), total);
    return { subtotal, discount, tax, rate, total, profit, cash, balance, advance, due: round2(total - advance) };
  },
  add(p) {
    const stock = num(p.stock);
    if (stock <= 0) { Toast.show(`${p.name} is out of stock`, 'error'); return false; }
    const line = this.st.items.find((i) => i.id === p.id);
    if (line) {
      if (line.qty + 1 > stock) { Toast.show(`Only ${stock} in stock for ${p.name}`, 'warn'); return false; }
      line.qty += 1;
    } else {
      this.st.items.push({ id: p.id, name: p.name, sku: p.sku, category: p.category, price: num(p.price), cost: num(p.cost), qty: 1 });
    }
    this.save();
    return true;
  },
  addCustom({ name, price, qty }) {
    this.st.items.push({ id: `x${uid()}`, custom: true, name, sku: '', category: 'Custom', price: num(price), cost: 0, qty: Math.max(1, Math.floor(num(qty)) || 1) });
    this.save();
  },
  setQty(id, qty) {
    const line = this.st.items.find((i) => i.id === id);
    if (!line) return;
    const p = findProduct(id);
    const stock = line.custom ? Infinity : p ? num(p.stock) : 0;
    qty = Math.floor(num(qty));
    if (qty <= 0) return this.remove(id);
    if (qty > stock) { Toast.show(`Only ${stock} in stock for ${line.name}`, 'warn'); qty = stock; }
    line.qty = qty;
    this.save();
  },
  remove(id) { this.st.items = this.st.items.filter((i) => i.id !== id); this.save(); },
  clear() { S.cart = { ...DEFAULTS().cart }; this.save(); },
};

/* =====================================================================
   9. SALES + PRODUCT OPERATIONS
   ===================================================================== */
const Sales = {
  /** Recompute everything that is derived from the sales list and save. */
  persist(...extra) {
    Inventory.recalc();
    S.invoices = S.sales.map((s) => ({ invoiceNo: s.invoiceNo, saleId: s.id, date: s.date, total: s.total }));
    Analytics.rebuildReports();
    Store.save('sales', 'invoices', 'products', 'deleted', ...extra);
  },
  /** Validates the cart, stores the sale and returns it. Stock updates through the ledger. */
  complete() {
    const c = Cart.st;
    if (!c.items.length) throw new Error('The cart is empty');
    for (const it of c.items) {
      if (it.custom) continue;
      const p = findProduct(it.id);
      if (!p) throw new Error(`"${it.name}" no longer exists in products`);
      if (num(p.stock) < it.qty) throw new Error(`Only ${num(p.stock)} of "${it.name}" left in stock`);
    }
    const t = Cart.totals();
    const method = PAY_METHODS.some((m) => m.id === c.method) ? c.method : 'Cash';
    const customerName = String(c.customer?.name || '').trim();
    const customerPhone = String(c.customer?.phone || '').trim();
    const date = new Date().toISOString();
    let cash = null, balance = 0, payments = [];
    if (method === 'Cash') {
      cash = t.cash === null ? t.total : t.cash;
      if (cash + 0.0001 < t.total) throw new Error(`Cash received is short by ${money(t.total - cash)}`);
      balance = round2(cash - t.total);
      payments = [{ id: uid(), method: 'Cash', amount: t.total, date }];
    } else if (method === 'Credit') {
      if (!customerName) throw new Error('Enter the customer name for a credit sale');
      if (t.advance > 0) payments = [{ id: uid(), method: 'Cash', amount: t.advance, date }];
    } else {
      payments = [{ id: uid(), method, amount: t.total, date }];
    }

    let no;
    do { S.invoiceCounter += 1; no = invoiceNo(S.invoiceCounter); } while (S.sales.some((x) => x.invoiceNo === no));   // never reuse a number we already know about
    const sale = {
      id: uid(), invoiceNo: no, date, updatedAt: Date.now(),
      items: c.items.map((i) => ({ ...i })),
      subtotal: t.subtotal, discount: t.discount, discType: c.discType, discValue: num(c.discValue),
      taxRate: t.rate, taxName: S.companySettings.taxName, tax: t.tax, total: t.total,
      method, payments, cash: cash === null ? null : round2(cash), balance, profit: t.profit,
      customerName, customerPhone,
      cashier: S.companySettings.cashier,
    };
    S.sales.push(sale);
    Cart.clear();
    this.persist('invoiceCounter');
    return sale;
  },
  addPayment(id, method, amount) {
    const s = S.sales.find((x) => x.id === id);
    if (!s) throw new Error('Sale not found');
    const due = saleDue(s);
    amount = round2(num(amount));
    if (amount <= 0) throw new Error('Enter an amount');
    if (amount > due + 0.0001) throw new Error(`Amount is more than the due ${money(due)}`);
    s.payments.push({ id: uid(), method, amount, date: new Date().toISOString() });
    s.updatedAt = Date.now();
    this.persist();
    return s;
  },
  remove(id) {
    const index = S.sales.findIndex((s) => s.id === id);
    if (index < 0) return null;
    const [sale] = S.sales.splice(index, 1);
    S.deleted.sales[id] = Date.now();
    this.persist();
    return { sale, index };
  },
  restore({ sale, index }) {
    S.sales.splice(Math.min(index, S.sales.length), 0, sale);
    sale.updatedAt = Date.now();
    delete S.deleted.sales[sale.id];
    this.persist();
  },
};

const Products = {
  ensureCategory(name) {
    name = String(name || '').trim();
    if (name && !S.categories.some((c) => c.toLowerCase() === name.toLowerCase())) { S.categories.push(name); Store.save('categories'); }
    return S.categories.find((c) => c.toLowerCase() === name.toLowerCase()) || name;
  },
  /** Insert or update a product (matched by id). `stock` is what the user sees; stockBase is derived from it. */
  commit(next, existing = null) {
    const target = existing || next;
    if (existing) Object.assign(existing, next, { id: existing.id, createdAt: existing.createdAt });
    else S.products.push(next);
    target.stockBase = num(next.stock) + Inventory.sold(target.id);
    target.updatedAt = Date.now();
    delete S.deleted.products[target.id];
    Inventory.recalc();
    return target;
  },
  remove(id) {
    const index = S.products.findIndex((p) => p.id === id);
    if (index < 0) return null;
    const [p] = S.products.splice(index, 1);
    S.deleted.products[id] = Date.now();
    Store.save('products', 'deleted');
    return { p, index };
  },
  restore({ p, index }) {
    S.products.splice(Math.min(index, S.products.length), 0, p);
    p.updatedAt = Date.now();
    delete S.deleted.products[p.id];
    Store.save('products', 'deleted');
  },
  /** Normalise a product coming from a form or an imported file. */
  normalize(raw) {
    const name = String(raw.name || '').trim();
    if (!name) return null;
    return {
      id: String(raw.id || uid()),
      name,
      category: String(raw.category || '').trim() || 'General',
      sku: String(raw.sku || '').trim(),
      barcode: String(raw.barcode || '').trim(),
      price: Math.max(0, num(raw.price)),
      cost: Math.max(0, num(raw.cost)),
      stock: Math.max(0, Math.floor(num(raw.stock))),
      lowStock: raw.lowStock === '' || raw.lowStock == null ? '' : Math.max(0, Math.floor(num(raw.lowStock))),
      image: typeof raw.image === 'string' && raw.image.startsWith('data:image/') ? raw.image : '',
      createdAt: raw.createdAt || new Date().toISOString(),
      updatedAt: Date.now(),
    };
  },
  autoSku() {
    let n = S.products.length + 1, sku;
    do { sku = `P${String(n++).padStart(4, '0')}`; } while (S.products.some((p) => p.sku === sku));
    return sku;
  },
};


/* =====================================================================
   10. MULTI-DEVICE SYNC (no server)
   ---------------------------------------------------------------------
   Every record has an id and an updatedAt. Deletions leave a tombstone.
   merge() is deterministic and idempotent, so devices that exchange data
   in any order (and any number of times) end up with identical data.
   Stock is derived from the merged sales, so it always agrees.
   ===================================================================== */
const cleanSale = (r) => {
  if (!r || !r.id || !r.invoiceNo || !r.date || !Array.isArray(r.items) || !Number.isFinite(Number(r.total))) return null;
  const payments = Array.isArray(r.payments)
    ? r.payments.filter((p) => p && p.id).map((p) => ({ id: String(p.id), method: String(p.method || 'Cash'), amount: round2(num(p.amount)), date: p.date || r.date }))
    : [{ id: `p-${r.id}`, method: r.method || 'Cash', amount: num(r.total), date: r.date }];
  return {
    ...r,
    id: String(r.id),
    items: r.items.map((i) => ({ id: String(i.id), name: String(i.name || ''), sku: i.sku || '', category: i.category || '', price: num(i.price), cost: num(i.cost), qty: Math.floor(num(i.qty)) })),
    payments,
    method: r.method || 'Cash',
    customerName: r.customerName || '', customerPhone: r.customerPhone || '',
    total: num(r.total), profit: num(r.profit),
    updatedAt: num(r.updatedAt) || Date.parse(r.date) || 0,
  };
};

const Sync = {
  fileName() { return `jmcpos-sync-${S.device.id}.json`; },
  snapshot() {
    const cs = S.companySettings;
    return {
      app: APP_ID, kind: 'sync', version: 2, deviceId: S.device.id, exportedAt: Date.now(),
      data: {
        products: S.products, sales: S.sales, orders: S.orders, categories: S.categories, deleted: S.deleted,
        settings: { updatedAt: cs.updatedAt || 0, ...Object.fromEntries(SHARED_SETTINGS.map((k) => [k, cs[k]])) },
      },
    };
  },

  /** Snapshot that also carries order photos (used for the manual sync file). */
  async snapshotFull() { const snap = this.snapshot(); snap.data.photos = await Photos.all(Orders.photoIds()); return snap; },

  /** Merge another device's snapshot into this device. Returns counts of what changed. */
  merge(snap) {
    snap = Clean.data(snap);
    if (snap && snap.data) Clean.snapshotData(snap.data);
    const d = snap && snap.data;
    if (!isPlainObject(d) || !Array.isArray(d.products || []) || !Array.isArray(d.sales || [])) throw new Error('That is not a POS sync file');
    const st = { productsAdded: 0, productsUpdated: 0, productsRemoved: 0, salesAdded: 0, salesUpdated: 0, salesRemoved: 0, ordersAdded: 0, ordersUpdated: 0, ordersRemoved: 0, renamed: 0, settings: 0, total: 0 };

    // 1. tombstones (union, newest wins)
    let tombChanged = false;
    if (!isPlainObject(S.deleted.orders)) S.deleted.orders = {};
    ['products', 'sales', 'orders'].forEach((k) => {
      const rm = d.deleted && d.deleted[k];
      if (isPlainObject(rm)) Object.entries(rm).forEach(([id, ts]) => { if (num(ts) > (S.deleted[k][id] || 0)) { S.deleted[k][id] = num(ts); tombChanged = true; } });
    });

    // 2. products: newest updatedAt wins
    const lp = new Map(S.products.map((p) => [p.id, p]));
    (d.products || []).forEach((raw) => {
      if (!raw || !raw.id) return;
      const rp = Products.normalize({ ...raw, stock: 0 });
      if (!rp) return;
      rp.id = String(raw.id); rp.stock = 0;
      rp.stockBase = num(raw.stockBase !== undefined ? raw.stockBase : raw.stock);
      rp.updatedAt = num(raw.updatedAt); rp.createdAt = raw.createdAt || rp.createdAt;
      const tomb = S.deleted.products[rp.id];
      if (tomb && tomb >= rp.updatedAt) return;
      const local = lp.get(rp.id);
      if (!local) { S.products.push(rp); lp.set(rp.id, rp); st.productsAdded++; }
      else if (rp.updatedAt > local.updatedAt) { Object.assign(local, rp); st.productsUpdated++; }
    });
    S.products = S.products.filter((p) => { const t = S.deleted.products[p.id]; if (t && t >= p.updatedAt) { st.productsRemoved++; return false; } return true; });

    // 3. sales: immutable except payments, which are merged as a union by payment id
    const ls = new Map(S.sales.map((s) => [s.id, s]));
    (d.sales || []).forEach((raw) => {
      const rs = cleanSale(raw);
      if (!rs) return;
      const tomb = S.deleted.sales[rs.id];
      if (tomb && tomb >= rs.updatedAt) return;
      const local = ls.get(rs.id);
      if (!local) { S.sales.push(rs); ls.set(rs.id, rs); st.salesAdded++; return; }
      const have = new Set(local.payments.map((p) => p.id));
      const add = rs.payments.filter((p) => !have.has(p.id));
      if (add.length) { local.payments.push(...add); local.updatedAt = Math.max(local.updatedAt, rs.updatedAt); st.salesUpdated++; }
    });
    S.sales = S.sales.filter((s) => { const t = S.deleted.sales[s.id]; if (t && t >= s.updatedAt) { st.salesRemoved++; return false; } return true; });

    // 3b. orders: newest edit wins; photos arrive separately
    const lo = new Map(S.orders.map((o) => [o.id, o]));
    (Array.isArray(d.orders) ? d.orders : []).forEach((raw) => {
      const ro = Orders.clean(raw);
      if (!ro) return;
      const tomb = S.deleted.orders[ro.id];
      if (tomb && tomb >= ro.updatedAt) return;
      const local = lo.get(ro.id);
      if (!local) { S.orders.push(ro); lo.set(ro.id, ro); st.ordersAdded++; }
      else if (ro.updatedAt > local.updatedAt) { Object.assign(local, ro); st.ordersUpdated++; }
    });
    S.orders = S.orders.filter((o) => { const t = S.deleted.orders[o.id]; if (t && t >= o.updatedAt) { st.ordersRemoved++; return false; } return true; });
    const og = new Map();
    S.orders.forEach((o) => { if (!og.has(o.no)) og.set(o.no, []); og.get(o.no).push(o); });
    og.forEach((arr) => { if (arr.length > 1) { arr.sort((a, b) => a.createdAt - b.createdAt || (a.id < b.id ? -1 : 1)); arr.slice(1).forEach((o) => { o.no = `${o.no}-${o.id.slice(-3).toUpperCase()}`; st.renamed++; }); } });
    if (isPlainObject(d.photos)) Photos.putMany(d.photos).then((n) => { if (n && Router.current() === 'orders') Router.refresh(); });

    // 4. two devices may have issued the same invoice number: the earliest keeps it, the rest get a stable suffix
    const groups = new Map();
    S.sales.forEach((s) => { if (!groups.has(s.invoiceNo)) groups.set(s.invoiceNo, []); groups.get(s.invoiceNo).push(s); });
    groups.forEach((arr) => {
      if (arr.length < 2) return;
      arr.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1));
      arr.slice(1).forEach((s) => { s.invoiceNo = `${s.invoiceNo}-${s.id.slice(-3).toUpperCase()}`; st.renamed++; });
    });

    // 5. shared settings (newest wins) and categories (union)
    const rset = d.settings;
    if (isPlainObject(rset) && num(rset.updatedAt) > num(S.companySettings.updatedAt)) {
      SHARED_SETTINGS.forEach((k) => { if (rset[k] !== undefined) S.companySettings[k] = rset[k]; });
      S.companySettings.updatedAt = num(rset.updatedAt);
      st.settings = 1;
    }
    let catAdded = 0;
    (Array.isArray(d.categories) ? d.categories : []).forEach((c) => {
      const name = String(c || '').trim();
      if (name && !S.categories.some((x) => x.toLowerCase() === name.toLowerCase())) { S.categories.push(name); catAdded++; }
    });
    S.products.forEach((p) => { if (p.category && !S.categories.some((x) => x.toLowerCase() === p.category.toLowerCase())) { S.categories.push(p.category); catAdded++; } });

    st.total = st.productsAdded + st.productsUpdated + st.productsRemoved + st.salesAdded + st.salesUpdated + st.salesRemoved + st.ordersAdded + st.ordersUpdated + st.ordersRemoved + st.renamed + st.settings + catAdded;
    Inventory.recalc();
    if (st.total) { Sales.persist(); Store.save('categories', 'companySettings', 'orders', 'deleted'); }
    else if (tombChanged) Store.save('deleted');
    S.device.lastSync = Date.now(); Store.save('device');
    return st;
  },

  describe(st) {
    const parts = [];
    if (st.salesAdded) parts.push(`${st.salesAdded} new sales`);
    if (st.salesUpdated) parts.push(`${st.salesUpdated} payment updates`);
    if (st.productsAdded) parts.push(`${st.productsAdded} new products`);
    if (st.productsUpdated) parts.push(`${st.productsUpdated} product updates`);
    if (st.productsRemoved || st.salesRemoved) parts.push(`${st.productsRemoved + st.salesRemoved} deletions`);
    if (st.ordersAdded) parts.push(`${st.ordersAdded} new orders`);
    if (st.ordersUpdated) parts.push(`${st.ordersUpdated} order updates`);
    if (st.ordersRemoved) parts.push(`${st.ordersRemoved} orders removed`);
    if (st.settings) parts.push('company settings');
    return parts.length ? parts.join(', ') : 'nothing new';
  },
};

/** Automatic sync through a shared folder (File System Access API: Chrome / Edge on desktop).
    Each device writes ONLY its own file and reads the others, so files never conflict. */
const FolderSync = {
  supported: typeof window.showDirectoryPicker === 'function',
  handle: null, state: 'off', msg: '', lastRun: null, timer: null, dirty: true, busy: false, seen: {}, onStatus: null,

  async kv(mode, key, value) {
    return mode === 'get' ? IDB.get('kv', key) : mode === 'set' ? IDB.put('kv', key, value) : IDB.del('kv', key);
  },
  emit() { if (this.onStatus) this.onStatus(); },

  async init() {
    Store.onChange = () => { this.dirty = true; if (this.handle && this.state === 'ok') this.schedule(); CloudSync.markDirty(); };
    if (!this.supported) return;
    try { const h = await this.kv('get', 'folder'); if (h) await this.attach(h); } catch { /* ignore */ }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.run(); });
    window.addEventListener('online', () => this.run());
  },
  async attach(h) {
    this.handle = h;
    const perm = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (perm !== 'granted') { this.state = 'needs-permission'; this.emit(); return; }
    this.start();
  },
  async connect() {
    const h = await window.showDirectoryPicker({ id: 'jmcpos', mode: 'readwrite' });
    await this.kv('set', 'folder', h);
    await this.attach(h);
    if (this.state === 'needs-permission') await this.resume();
  },
  async resume() {
    const perm = await this.handle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') this.start(); else { this.state = 'needs-permission'; this.emit(); }
  },
  async disconnect() {
    clearInterval(this.timer); clearTimeout(this._t);
    this.handle = null; this.state = 'off'; this.seen = {}; this.msg = '';
    try { await this.kv('del', 'folder'); } catch { /* ignore */ }
    this.emit();
  },
  start() { clearInterval(this.timer); this.state = 'ok'; this.timer = setInterval(() => this.run(), 20000); this.run(); },
  schedule() { clearTimeout(this._t); this._t = setTimeout(() => this.run(), 1500); },

  async run() {
    if (!this.handle || this.busy || this.state === 'needs-permission' || this.state === 'off') return;
    this.busy = true;
    try {
      const own = Sync.fileName();
      let changed = 0, files = 0;
      const entries = new Map();
      for await (const [name, fh] of this.handle.entries()) if (fh.kind === 'file') entries.set(name, fh);
      for (const [name, fh] of entries) {
        if (!/^jmcpos-sync-.+\.json$/.test(name) || name === own) continue;
        files++;
        const file = await fh.getFile();
        const sig = `${file.lastModified}:${file.size}`;
        if (this.seen[name] === sig) continue;
        let snap;
        try { snap = JSON.parse(await file.text()); } catch { continue; } // half-written: retry next round
        try { const st = Sync.merge(snap); changed += st.total; this.seen[name] = sig; } catch { this.seen[name] = sig; }
      }
      for (const id of await Photos.missing()) {          // order photos sent by other devices
        const fh = entries.get(`jmcpos-photo-${id}.json`);
        if (!fh) continue;
        try { await Photos.put(id, JSON.parse(await (await fh.getFile()).text())); changed++; } catch { /* retry later */ }
      }
      const have = await Photos.keys();
      for (const id of Orders.photoIds()) {               // share our order photos
        const name = `jmcpos-photo-${id}.json`;
        if (entries.has(name) || !have.has(id)) continue;
        const fh = await this.handle.getFileHandle(name, { create: true });
        const w = await fh.createWritable(); await w.write(JSON.stringify(await Photos.get(id))); await w.close();
      }
      if (changed || this.dirty) {
        const fh = await this.handle.getFileHandle(own, { create: true });
        const w = await fh.createWritable();
        await w.write(JSON.stringify(Sync.snapshot()));
        await w.close();
        this.dirty = false;
      }
      this.state = 'ok'; this.msg = ''; this.lastRun = Date.now(); this.peers = files;
      if (changed) App.remoteChanged(changed);
    } catch (e) {
      this.state = /permission|NotAllowed/i.test(e.name + e.message) ? 'needs-permission' : 'error';
      this.msg = e.message || String(e);
    } finally { this.busy = false; this.emit(); }
  },
};


/* =====================================================================
   11. EXCEL (.xlsx) EXPORT, written from scratch so it works offline
   (an .xlsx is a ZIP of XML files; we store the entries uncompressed)
   ===================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
const crc32 = (u8) => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };

const zipStore = (files) => {
  const enc = new TextEncoder();
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = [];
  let offset = 0;
  files.forEach((f) => {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  const all = [...parts, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
  let pos = 0;
  all.forEach((b) => { out.set(b, pos); pos += b.length; });
  return out;
};

const xmlEsc = (s) => String(s ?? '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colName = (i) => { let s = '', n = i + 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const excelSerial = (iso) => { const d = new Date(iso); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()) / 86400000 + 25569; };

/** sheet = { name, cols: [{ h, w, t: 's'|'n'|'m'|'dt', sum?: true }], rows: [[...]] } */
const sheetXml = (sh) => {
  const nCols = sh.cols.length;
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  xml += '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  xml += `<cols>${sh.cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.w || 14}" customWidth="1"/>`).join('')}</cols><sheetData>`;
  xml += `<row r="1">${sh.cols.map((c, i) => `<c r="${colName(i)}1" s="1" t="inlineStr"><is><t>${xmlEsc(c.h)}</t></is></c>`).join('')}</row>`;
  sh.rows.forEach((row, ri) => {
    const r = ri + 2;
    xml += `<row r="${r}">`;
    sh.cols.forEach((c, ci) => {
      const v = row[ci], ref = `${colName(ci)}${r}`;
      if (v === '' || v == null) return;
      if (c.t === 's') xml += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      else if (c.t === 'dt') xml += `<c r="${ref}" s="2"><v>${excelSerial(v)}</v></c>`;
      else xml += `<c r="${ref}"${c.t === 'm' ? ' s="3"' : ''}><v>${Number(v)}</v></c>`;
    });
    xml += '</row>';
  });
  const last = sh.rows.length + 1;
  if (sh.cols.some((c) => c.sum) && sh.rows.length) {
    const r = last + 1;
    xml += `<row r="${r}">${sh.cols.map((c, ci) => {
      const ref = `${colName(ci)}${r}`;
      if (ci === 0) return `<c r="${ref}" s="4" t="inlineStr"><is><t>TOTAL</t></is></c>`;
      if (!c.sum) return '';
      const tot = sh.rows.reduce((a, row) => a + num(row[ci]), 0);
      return `<c r="${ref}" s="${c.t === 'm' ? 5 : 4}"><f>SUM(${colName(ci)}2:${colName(ci)}${last})</f><v>${round2(tot)}</v></c>`;
    }).join('')}</row>`;
  }
  xml += `</sheetData><autoFilter ref="A1:${colName(nCols - 1)}${Math.max(last, 2)}"/></worksheet>`;
  return xml;
};

const buildXlsx = (sheets) => {
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>';
  const wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
    `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy\\-mm\\-dd\\ hh:mm"/></numFmts>' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE6F7"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '<xf numFmtId="4" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  return zipStore([
    { name: '[Content_Types].xml', data: ct }, { name: '_rels/.rels', data: rels },
    { name: 'xl/workbook.xml', data: wb }, { name: 'xl/_rels/workbook.xml.rels', data: wbRels }, { name: 'xl/styles.xml', data: styles },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) })),
  ]);
};

const downloadBlob = (filename, bytes, type) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};

/** Export a list of sales as an Excel workbook: Sales, Items, Daily summary. */
const exportSalesXlsx = (list, label = 'all') => {
  const sorted = [...list].sort((a, b) => new Date(a.date) - new Date(b.date));
  const salesSheet = {
    name: 'Sales',
    cols: [
      { h: 'Invoice', w: 18, t: 's' }, { h: 'Date & time', w: 18, t: 'dt' }, { h: 'Customer', w: 22, t: 's' }, { h: 'Phone', w: 14, t: 's' },

      { h: 'Paid', w: 14, t: 'm', sum: true }, { h: 'Due', w: 14, t: 'm', sum: true }, { h: 'Profit', w: 13, t: 'm', sum: true }, { h: 'Cashier', w: 12, t: 's' },
    ],
    rows: sorted.map((s) => [s.invoiceNo, s.date, s.customerName, s.customerPhone, s.method, s.items.reduce((a, i) => a + i.qty, 0),
      s.subtotal, s.discount, s.tax, s.total, salePaid(s), saleDue(s), s.profit, s.cashier]),
  };
  const itemsSheet = {
    name: 'Items',
    cols: [
      { h: 'Invoice', w: 18, t: 's' }, { h: 'Date & time', w: 18, t: 'dt' }, { h: 'Customer', w: 22, t: 's' }, { h: 'Product', w: 30, t: 's' }, { h: 'SKU', w: 12, t: 's' },
      { h: 'Category', w: 16, t: 's' }, { h: 'Qty', w: 8, t: 'n', sum: true }, { h: 'Unit price', w: 13, t: 'm' }, { h: 'Line total', w: 14, t: 'm', sum: true },
    ],
    rows: sorted.flatMap((s) => s.items.map((i) => [s.invoiceNo, s.date, s.customerName, i.name, i.sku, i.category, i.qty, i.price, round2(i.price * i.qty)])),
  };
  const byDay = new Map();
  sorted.forEach((s) => {
    const k = dayKey(s.date);
    const r = byDay.get(k) || { orders: 0, revenue: 0, profit: 0, Cash: 0, Card: 0, 'Bank Transfer': 0, Credit: 0 };
    r.orders += 1; r.revenue += s.total; r.profit += s.profit; r[s.method] = (r[s.method] || 0) + s.total;
    byDay.set(k, r);
  });
  const daySheet = {
    name: 'Daily summary',
    cols: [
      { h: 'Date', w: 14, t: 's' }, { h: 'Bills', w: 8, t: 'n', sum: true }, { h: 'Revenue', w: 14, t: 'm', sum: true }, { h: 'Profit', w: 14, t: 'm', sum: true },
