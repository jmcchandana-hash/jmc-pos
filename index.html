   24. APP: wiring, cross-tab / cross-device refresh, boot
   ===================================================================== */
const isTyping = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
const App = {
  /** Called when the folder sync merged changes from another device. */
  remoteChanged(n) {
    Toast.show(`Updated from another device (${n} change${n === 1 ? '' : 's'})`, 'info', { ms: 2500 });
    Shell.render(); Reminders.renderBar();
    if (!Modal.top && !isTyping()) Router.refresh();
  },
  /** Another tab of this browser wrote to localStorage: reload our in-memory copy. */
  reloadFromStorage: debounce(() => {
    Store.load(); Inventory.migrate(); migrateReminderKeys(); Theme.apply(); Shell.render();
    if (!Modal.top && !isTyping()) Router.refresh();
  }, 300),
};

const wireEvents = () => {
  document.addEventListener('keydown', (e) => Scanner.onKey(e), true);   // capture phase: runs before page handlers
  document.addEventListener('click', (e) => {
    const backdrop = e.target.closest('[data-modal]');
    if (backdrop && e.target === backdrop) { Modal.close(backdrop.dataset.modal); return; }
    const el = e.target.closest('[data-action]');
    if (el && Actions[el.dataset.action]) Actions[el.dataset.action](el, e);
  });
  document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el) Inputs[el.dataset.input]?.(el, e); });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el) Changes[el.dataset.change]?.(el, e); });
  document.addEventListener('keydown', (e) => { const el = e.target.closest?.('[data-keydown]'); if (el) Keydowns[el.dataset.keydown]?.(el, e); });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('[data-form]');
    if (form) { e.preventDefault(); Forms[form.dataset.form]?.(form); }
  });

  /* Global keyboard shortcuts */
  document.addEventListener('keydown', (e) => {
    if (Lock.locked) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Escape' && Modal.top) { Modal.close(); return; }
    if (Modal.top) return;
    if (e.altKey && /^[1-8]$/.test(e.key)) { e.preventDefault(); Router.go(ROUTES[+e.key - 1].id); return; }
    if (Router.current() === 'pos') {
      if (e.key === 'F2' || (e.key === '/' && !typing)) { e.preventDefault(); $('#pos-search')?.focus(); $('#pos-search')?.select(); }
      else if (e.key === 'F4') { e.preventDefault(); $('#cash-input')?.focus(); }
      else if (e.key === 'F8') { e.preventDefault(); Actions['cart-cancel'](); }
      else if (e.key === 'F9') { e.preventDefault(); completeSaleFlow(); }
    }
    if (e.key === '?' && !typing) Actions.shortcuts();
  });

  window.addEventListener('hashchange', Router.render);
  window.addEventListener('storage', (e) => { if (!e.key || KEYS.includes(e.key)) App.reloadFromStorage(); });
  /* Print with a light palette even if dark mode is on */
  window.addEventListener('beforeprint', () => document.documentElement.classList.remove('dark'));
  window.addEventListener('afterprint', () => Theme.apply());
};

/** Optional PIN lock for this device (screen lock). It keeps other people out of the app on a shared or lost phone.
    It is not disk encryption: the data itself is still stored in the browser. */
const Lock = {
  locked: false, last: Date.now(), timer: null,
  cfg() { return S.device.lock || (S.device.lock = { salt: '', hash: '', minutes: 5, fails: 0, until: 0 }); },
  enabled() { return !!this.cfg().hash; },
  supported() { return !!(window.crypto && crypto.subtle); },
  hex(buf) { return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join(''); },
  unhex(h) { return new Uint8Array(String(h).match(/../g).map((x) => parseInt(x, 16))); },
  async derive(pin, salt) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    return this.hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, key, 256));
  },
  weak(pin) { return /^(\d)\1+$/.test(pin) || '0123456789'.includes(pin) || '9876543210'.includes(pin); },
  async setPin(pin) { const salt = crypto.getRandomValues(new Uint8Array(16)); const c = this.cfg(); c.salt = this.hex(salt); c.hash = await this.derive(pin, salt); c.fails = 0; c.until = 0; Store.save('device'); },
  clear() { const c = this.cfg(); c.salt = ''; c.hash = ''; c.fails = 0; c.until = 0; Store.save('device'); this.unlock(); },
  /** true = correct. Throws when locked out after repeated wrong PINs (waits 30 s, doubling, up to 15 min). */
  async check(pin) {
    const c = this.cfg();
    if (Date.now() < num(c.until)) throw new Error(`Too many wrong PINs. Try again in ${Math.ceil((c.until - Date.now()) / 1000)} seconds`);
    const h = await this.derive(String(pin), this.unhex(c.salt));
    let diff = h.length ^ c.hash.length; for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ (c.hash.charCodeAt(i) || 0);
    if (diff === 0) { c.fails = 0; c.until = 0; Store.save('device'); return true; }
    c.fails = num(c.fails) + 1;
    if (c.fails >= 5) c.until = Date.now() + Math.min(900000, 30000 * 2 ** (c.fails - 5));
    Store.save('device'); return false;
  },
  show() {
    if (this.locked || !this.enabled()) return;
    this.locked = true;
    const el = document.createElement('div');
    el.id = 'lock';
    el.className = 'fixed inset-0 z-[200] flex items-center justify-center bg-slate-950/90 p-6 backdrop-blur-2xl';
    el.innerHTML = `<form data-form="lock" class="w-full max-w-xs space-y-4 rounded-[2rem] border border-white/20 bg-white/85 p-6 text-center shadow-2xl dark:bg-slate-900/85" novalidate>
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-primary-600 text-white">${icon('lock', 'h-7 w-7')}</div>
      <div><h2 class="text-lg font-extrabold text-slate-900 dark:text-white">JMC STUDIO POS</h2><p class="text-sm ${C.muted}">Enter your PIN to open</p></div>
      <input id="lock-pin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN" class="${C.input} text-center text-2xl tracking-[0.4em]">
      <p id="lock-msg" class="min-h-5 text-xs font-semibold text-red-600 dark:text-red-400" role="alert"></p>
      <button type="submit" class="${C.btn} w-full">Unlock</button></form>`;
    document.body.appendChild(el);
    [...document.body.children].forEach((n) => { if (n !== el) n.setAttribute('inert', ''); });
    setTimeout(() => $('#lock-pin')?.focus(), 50);
    I18N.lang === 'si' && I18N.start && I18N.translateNode && I18N.translateNode(el);
  },
  unlock() {
    this.locked = false; this.last = Date.now();
    $('#lock')?.remove();
    [...document.body.children].forEach((n) => n.removeAttribute('inert'));
  },
  maybeLock() { const m = num(this.cfg().minutes); if (this.enabled() && !this.locked && m > 0 && Date.now() - this.last > m * 60000) this.show(); },
  init() {
    const touch = () => { if (!this.locked) this.last = Date.now(); };
    ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach((ev) => document.addEventListener(ev, touch, { capture: true, passive: true }));
    clearInterval(this.timer); this.timer = setInterval(() => this.maybeLock(), 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.maybeLock(); });
    if (this.enabled()) this.show();
  },
};
Forms.lock = async (form) => {
  const pin = String(new FormData(form).get('pin') || '');
  const msg = $('#lock-msg'); const say = (t) => { if (msg) msg.textContent = t; };
  if (!pin) return;
  try {
    if (await Lock.check(pin)) { Lock.unlock(); return; }
    say(Lock.cfg().until > Date.now() ? `Too many wrong PINs. Wait ${Math.ceil((Lock.cfg().until - Date.now()) / 1000)} seconds` : 'Wrong PIN');
  } catch (e) { say(e.message); }
  form.reset(); $('#lock-pin')?.focus();
};
Forms.pinset = async (form) => {
  const f = new FormData(form); const cur = String(f.get('current') || ''), pin = String(f.get('pin') || ''), pin2 = String(f.get('pin2') || '');
  if (!Lock.supported()) return Toast.show('This browser cannot protect a PIN here. Open the app over https (the GitHub link) to use the PIN lock', 'error', { ms: 6000 });
  if (Lock.enabled()) { try { if (!(await Lock.check(cur))) return Toast.show('The current PIN is wrong', 'error'); } catch (e) { return Toast.show(e.message, 'error'); } }
  if (!/^\d{4,12}$/.test(pin)) return Toast.show('The PIN must be 4 to 12 digits', 'error');
  if (Lock.weak(pin)) return Toast.show('That PIN is too easy to guess (like 1234 or 1111). Choose another', 'error');
  if (pin !== pin2) return Toast.show('The two PINs do not match', 'error');
  await Lock.setPin(pin); Toast.show('PIN lock is on', 'success'); Router.refresh();
};
Forms.pinoff = async (form) => {
  const cur = String(new FormData(form).get('current') || '');
  try { if (!(await Lock.check(cur))) return Toast.show('The current PIN is wrong', 'error'); } catch (e) { return Toast.show(e.message, 'error'); }
  Lock.clear(); Toast.show('PIN lock is off', 'info'); Router.refresh();
};

  splash.classList.add('opacity-0', 'pointer-events-none');
  setTimeout(() => splash.remove(), 350);
  if (localStorage.getItem('debug') === '1') window.__pos = { AutoMail, S, Orders, Photos, Reminders, CloudSync, BackupMail, Backup, Sync, FolderSync, Cart, Sales, Products, Inventory, WA, exportSalesXlsx, Analytics };   // handy for support / debugging
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

/* PWA: offline cache + "new version" prompt (works only over https, e.g. GitHub Pages) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      const ask = (w) => Toast.show('අලුත් version එකක් ලැබුණා', 'info', { label: 'Update', ms: 60000, action: () => w.postMessage('SKIP_WAITING') });
      if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); });
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  });
}
})();

</script>
